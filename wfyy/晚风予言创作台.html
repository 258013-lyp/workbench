/* 「全部」视图的主指标：顶层缺失时从各平台 metrics 兜底汇总 */
function mainMetrics(w){
  const p=Number(w&&w.plays)||0, l=Number(w&&w.likes)||0, f=Number(w&&w.favs)||0, c=Number(w&&w.comments)||0;
  if(p||l||f||c) return {plays:p,likes:l,favs:f,comments:c};
  const m=(w&&w.metrics)||{}; let P=0,L=0,F=0,C=0;
  Object.keys(m).forEach(k=>{ const x=m[k]||{}; P+=Number(x.plays)||0; L+=Number(x.likes)||0; F+=Number(x.favs)||0; C+=Number(x.comments)||0; });
  return {plays:P,likes:L,favs:F,comments:C};
}
function renderData(){
  const box=document.getElementById('dataCharts');
  const empty=document.getElementById('dataEmpty');
  if(!box || !empty) return;
  if(curTab && curTab!=='data') return;                 // 效率：非数据页不做重活，切到该页时再算
  const allWorks=safeArr(state.works);
  const curDataPlat = dataPlat || '全部';
  // 单平台视图：只统计真正发布到该平台的作品，避免混入其他平台
  const works = curDataPlat==='全部' ? allWorks : allWorks.filter(w=>(w.platforms||[]).indexOf(curDataPlat)>=0);
  // 指标缓存：一次渲染中每条作品只计算一次
  const MC = new Map();
  const wm = w => { let v=MC.get(w); if(v===undefined){ v = curDataPlat==='全部' ? mainMetrics(w) : getPlatMetrics(w,curDataPlat); MC.set(w,v); } return v; };
  if(!allWorks.length){ empty.style.display='block'; box.innerHTML=''; return; }
  empty.style.display='none';

  // 平台切换 Tab（计数始终基于全部作品）
  const platTabs = ['全部'].concat(PLATFORMS).map(p=>{
    const on = p===curDataPlat;
    const cnt = p==='全部' ? allWorks.length : allWorks.filter(w=>(w.platforms||[]).indexOf(p)>=0).length;
    return `<button class="plat-tab ${on?'on':''}" onclick="setDataPlat('${jsAttr(p)}')">${esc(p)}<small>${cnt}</small></button>`;
  }).join('');
  const platTabHtml = `<div class="plat-tabs">${platTabs}</div>`;
  if(!works.length){
    box.innerHTML = platTabHtml + '<div class="empty" style="padding:26px 12px"><div>「'+esc(curDataPlat)+'」还没有发布记录，可切换到其他平台查看</div></div>';
    return;
  }
  // 数据复盘只看「已回填数据」的作品：刚发布的新作品数据为 0，不计入 KPI/Top5/互动率，避免拉低均值
  const dataWorks = works.filter(workHasData);
  if(!dataWorks.length){
    box.innerHTML = platTabHtml + '<div class="empty" style="padding:26px 12px"><div>📡 当前作品都还在「数据待回填」状态——发布后去各平台后台看一眼，点作品卡「回填数据」即可。看板会自动汇总已回填的作品（播放、互动率、爆款公式都基于真实数据）。</div></div>';
    return;
  }

  // ===== 基础聚合（合集维度） =====
  const byCol = COLLECTIONS.map(c=>{
    const ws=dataWorks.filter(w=>w.collection===c.key);
    const plays=ws.reduce((s,w)=>s+(wm(w).plays),0);
    const likes=ws.reduce((s,w)=>s+(wm(w).likes),0);
    const favs=ws.reduce((s,w)=>s+(wm(w).favs),0);
    const comments=ws.reduce((s,w)=>s+(wm(w).comments),0);
    const inter=likes+favs+comments;
    return {name:c.name, key:c.key, color:c.color, count:ws.length,
      plays, likes, favs, comments, inter,
      likeRate: pct(likes,plays), favRate: pct(favs,plays), comRate: pct(comments,plays),
      interRate: pct(inter,plays)};
  });
  const totalPlays=byCol.reduce((s,c)=>s+c.plays,0);
  const totalLikes=byCol.reduce((s,c)=>s+c.likes,0);
  const totalFavs=byCol.reduce((s,c)=>s+c.favs,0);
  const totalCom=byCol.reduce((s,c)=>s+c.comments,0);
  const totalInter=totalLikes+totalFavs+totalCom;
  const avgInterRate = pct(totalInter, totalPlays);

  const bestCol = byCol.slice().sort((a,b)=>b.interRate-a.interRate)[0];
  const bestFavCol = byCol.slice().sort((a,b)=>b.favRate-a.favRate)[0];
  const bestComCol = byCol.slice().sort((a,b)=>b.comRate-a.comRate)[0];

  // 爆款：赞播比 >=5% 的作品
  const hot = dataWorks.map(w=>({w, r:pct(wm(w).likes, wm(w).plays)})).filter(x=>x.r>=5).sort((a,b)=>b.r-a.r);
  const hotCount = hot.length;

  // 形式对比（视频/图文 平均赞播比）
  const formRate = {};
  dataWorks.forEach(w=>{ const f=w.form||'未填'; const r=pct(wm(w).likes,wm(w).plays); if(!formRate[f])formRate[f]={n:0,sum:0}; formRate[f].n++; formRate[f].sum+=r; });
  const formArr = Object.keys(formRate).map(f=>({f, n:formRate[f].n, rate: formRate[f].sum/formRate[f].n})).sort((a,b)=>b.rate-a.rate);

  // 各合集作品数 柱状
  const maxCount=Math.max(1,...byCol.map(c=>c.count));
  const barW=44, gap=18, chartW=byCol.length*(barW+gap)+10, chartH=180, baseY=chartH-28;
  let bars='';
  byCol.forEach((c,i)=>{
    const h=c.count/maxCount*(chartH-50); const x=10+i*(barW+gap);
    bars+=`<rect x="${x}" y="${baseY-h}" width="${barW}" height="${h}" rx="6" fill="${c.color}"/>`;
    bars+=`<text x="${x+barW/2}" y="${baseY-h-7}" text-anchor="middle" font-size="12" fill="#2E2A36" font-weight="700">${c.count}</text>`;
    bars+=`<text x="${x+barW/2}" y="${baseY+16}" text-anchor="middle" font-size="10.5" fill="#8A8594">${c.name.slice(2)}</text>`;
  });
  const barSvg=`<svg viewBox="0 0 ${chartW} ${chartH}" width="100%" preserveAspectRatio="xMidYMid meet" style="max-height:200px">${bars}<line x1="6" y1="${baseY}" x2="${chartW-4}" y2="${baseY}" stroke="#ECE7DF"/></svg>`;

  // 互动占比 环形
  const totalInterD=byCol.reduce((s,c)=>s+c.inter,0)||1;
  let donut='', off=0, cx=90, cy=90, r=62, C=2*Math.PI*r;
  byCol.forEach(c=>{ if(c.inter<=0)return; const frac=c.inter/totalInterD; const len=frac*C; donut+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.color}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`; off+=len; });
  const legend=byCol.map(c=>`<span><i style="background:${c.color}"></i>${c.name.slice(2)} ${totalInterD?Math.round(c.inter/totalInterD*100):0}%</span>`).join('');
  const donutSvg=`<svg viewBox="0 0 180 180" width="100%" style="max-height:200px">${donut}<text x="90" y="86" text-anchor="middle" font-size="13" fill="#8A8594">总互动</text><text x="90" y="104" text-anchor="middle" font-size="16" fill="#2E2A36" font-weight="700">${fmt(totalInter)}</text></svg>`;

  // 发布趋势 折线（近6月）
  const months={}; works.forEach(w=>{ const m=(w.date||'').slice(0,7); if(m) months[m]=(months[m]||0)+1; });
  const ms=Object.keys(months).sort().slice(-6);
  const maxM=Math.max(1,...ms.map(m=>months[m]));
  const W=460,H=170,pad=30, bw=(W-pad*2)/Math.max(1,ms.length-1||1);
  let pts='',area='',labels='';
  ms.forEach((m,i)=>{ const x=pad+i*bw; const y=H-pad-(months[m]/maxM)*(H-pad*2); pts+=(i?'L':'M')+x+' '+y+' '; if(i===0)area=`M${x} ${H-pad} `; area+=`L${x} ${y} `; if(i===ms.length-1)area+=`L${x} ${H-pad} Z`; labels+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#8A8594">${m.slice(5)}月</text>`; labels+=`<text x="${x}" y="${y-7}" text-anchor="middle" font-size="11" fill="#6B7FD7" font-weight="700">${months[m]}</text>`; });
  const lineSvg=ms.length>1?`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="max-height:200px"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B7FD7" stop-opacity=".25"/><stop offset="1" stop-color="#6B7FD7" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#g1)"/><path d="${pts}" fill="none" stroke="#6B7FD7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${labels}</svg>`:'<div style="padding:30px;text-align:center;color:var(--ink2)">发布满 2 个月份后展示趋势折线</div>';

  // 播放 Top5
  const top=dataWorks.slice().sort((a,b)=>(wm(b).plays)-(wm(a).plays)).slice(0,5);
  const topHtml=top.map((w,i)=>{ const c=colOf(w.collection); return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f4f0ea"><span style="width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto">${i+1}</span><div style="min-width:0;flex:1"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.title)}</div><div style="font-size:12px;color:var(--ink2)">${c.name} · ${esc(w.date||'—')}</div></div><div style="font-size:14px;font-weight:700;color:var(--primary)">${fmt(wm(w).plays)}</div></div>`; }).join('');

  // ===== 各合集互动率对比（水平条，按互动率排序） =====
  const rateSorted=byCol.slice().sort((a,b)=>b.interRate-a.interRate);
  const maxRate=Math.max(1,...rateSorted.map(c=>c.interRate));
  const colRateBars=rateSorted.map(c=>{
    const wpct=Math.round(c.interRate/maxRate*100);
    return `<div class="bar-row"><div class="bar-label" style="color:${c.color};font-weight:600">${c.name.slice(2)}</div><div class="bar-track"><div class="bar-fill" style="width:${wpct}%;background:${c.color}"></div></div><div class="bar-val">${c.interRate.toFixed(1)}%</div></div>`;
  }).join('');

  // ===== 形式对比（视频/图文 平均赞播比） =====
  const maxFormRate=Math.max(1,...formArr.map(x=>x.rate));
  const formBars=formArr.map(f=>{ const wpct=Math.round(f.rate/maxFormRate*100); const col=f.f==='视频'?'#7C8FE0':'#6BAE8F'; return `<div class="bar-row"><div class="bar-label">${esc(f.f)}</div><div class="bar-track"><div class="bar-fill" style="width:${wpct}%;background:${col}"></div></div><div class="bar-val">${f.rate.toFixed(1)}%</div></div>`; }).join('') || '<div style="padding:14px;color:var(--ink2)">记录作品时选「形式」后可对比</div>';

  // ===== 平台发布分布（按作品归属统计） =====
  const platCount={}; PLATFORMS.forEach(p=>platCount[p]=0);
  works.forEach(w=>(w.platforms||[]).forEach(p=>{ if(platCount[p]===undefined)platCount[p]=0; platCount[p]++; }));
  const platArr=Object.keys(platCount).map(p=>({p,n:platCount[p]})).sort((a,b)=>b.n-a.n);
  const maxPlat=Math.max(1,...platArr.map(x=>x.n));
  const platBars=platArr.map(x=>{ const wpct=Math.round(x.n/maxPlat*100); return `<div class="bar-row"><div class="bar-label">${esc(x.p)}</div><div class="bar-track"><div class="bar-fill" style="width:${wpct}%;background:linear-gradient(90deg,#7C8FE0,#9B7FD0)"></div></div><div class="bar-val">${x.n} 条</div></div>`; }).join('');

  // ===== 发布星期热力（平均互动率） =====
  const dowNames=['周日','周一','周二','周三','周四','周五','周六'];
  const dow={}; for(let i=0;i<7;i++)dow[i]={plays:0,inter:0,n:0};
  dataWorks.forEach(w=>{ if(!w.date)return; const d=new Date(w.date); if(isNaN(d))return; const k=d.getDay(); dow[k].plays+=(wm(w).plays); dow[k].inter+=(wm(w).likes)+(wm(w).favs)+(wm(w).comments); dow[k].n++; });
  const dowRate=Object.keys(dow).map(k=>({k:Number(k), n:dow[k].n, plays:dow[k].plays, inter:dow[k].inter, rate:pct(dow[k].inter,dow[k].plays)}));
  const maxDow=Math.max(0.1,...dowRate.map(x=>x.rate));
  const bestDow=dowRate.slice().sort((a,b)=>b.rate-a.rate)[0];
  const heatCells=dowRate.map(x=>{ const op=(x.rate/maxDow*0.8+0.2).toFixed(2); const bg=`rgba(108,127,215,${op})`; return `<div class="heat-cell" style="background:${bg}"><span>${x.rate>0?x.rate.toFixed(1)+'%':'—'}</span><small>${dowNames[x.k]}</small></div>`; }).join('');

  // ===== 爆款内容公式 =====
  let formula='';
  if(hot.length){
    const tagFreq={}; const colFreq={};
    hot.forEach(x=>{ colFreq[x.w.collection]=(colFreq[x.w.collection]||0)+1; (x.w.tags||[]).forEach(t=>tagFreq[t]=(tagFreq[t]||0)+1); });
    const topCol=Object.keys(colFreq).sort((a,b)=>colFreq[b]-colFreq[a])[0];
    const topTags=Object.keys(tagFreq).sort((a,b)=>tagFreq[b]-tagFreq[a]).slice(0,6);
    const colName=(colOf(topCol).name||topCol);
    const topTagHtml = topTags.length? `<br>· 高频标签：${topTags.map(t=>`<span class="chip chip-tag">#${esc(t)}</span>`).join(' ')}` : '';
    const avgHotRate = (hot.reduce((s,x)=>s+x.r,0)/hot.length).toFixed(1);
    formula=`<div style="line-height:1.9;font-size:13.5px;color:var(--ink)">
      🔥 你共有 <b style="color:var(--red)">${hotCount}</b> 条「高共鸣爆款」（赞播比≥5%），它们的共性：
      <br>· 主要来自合集 <b>${colName}</b>（${colFreq[topCol]} 条）
      ${topTagHtml}
      <br>· 平均赞播比 <b>${avgHotRate}%</b>，明显高于整体 ${avgInterRate.toFixed(1)}%
    </div>`;
  } else {
    formula='<div style="padding:14px;color:var(--ink2);font-size:13px">暂无赞播比≥5% 的爆款。多记录带互动数据的作品，系统会在这里总结你的「内容公式」。</div>';
  }

  // ===== 策略提示文案（分支先提成变量，避免嵌套反引号） =====
  const favPart = bestCol.key!==bestFavCol.key ? `，<b>${bestFavCol.name}</b> 收藏率最佳（${bestFavCol.favRate.toFixed(1)}%），适合做「收藏向」内容` : '';
  const comPart = (bestComCol.key!==bestCol.key && bestComCol.key!==bestFavCol.key) ? `，<b>${bestComCol.name}</b> 评论率最高（${bestComCol.comRate.toFixed(1)}%），易引发讨论` : '';
  const bestDowName = bestDow.n ? dowNames[bestDow.k] : '—';
  const tip=`📌 <b>策略提示</b>：综合互动率最高的是 <b>${bestCol.name}</b>（${bestCol.interRate.toFixed(1)}%）${favPart}${comPart}；最佳发布日为 <b>${bestDowName}</b>。建议本轮优先排互动率高的合集，并参考爆款共性调整选题。`;

  // ===== 组装 =====
  // 平台专属指标卡（单平台时展示该平台全部差异化指标）
  let platSpecific='';
  if(curDataPlat!=='全部'){
    const def=PLAT_METRICS[curDataPlat]||[]; const agg=aggregatePlat(works,curDataPlat);
    const cells=def.map(([k,name])=>'<div class="metric"><b>'+fmt(agg[k])+'</b><span>'+esc(name)+'</span></div>').join('');
    platSpecific='<div class="chart-card full"><h3>📊 '+esc(curDataPlat)+' · 平台专属指标（汇总）</h3><div class="metrics" style="flex-wrap:wrap">'+cells+'</div></div>';
  }
  const platDistHtml = curDataPlat==='全部'
    ? '<div class="chart-card full"><h3>平台发布分布</h3>'+platBars+'<div style="font-size:11.5px;color:var(--ink2);margin-top:6px">按作品归属统计你各平台发布量</div></div>'
    : '';

  // ===== 全平台覆盖分析（你全平台分发） =====
  // 覆盖分析恒按「全部作品」口径，避免在单平台视图下失真
  const allPlatWorks = allWorks.filter(w=>(w.platforms||[]).length>=PLATFORMS.length);
  const covRate = allWorks.length? Math.round(allPlatWorks.length/allWorks.length*100):0;
  const partial = allWorks.filter(w=>(w.platforms||[]).length>0 && (w.platforms||[]).length<PLATFORMS.length)
    .sort((a,b)=>(a.platforms||[]).length-(b.platforms||[]).length);
  const partialHtml = partial.length? partial.map(w=>{
    const have=(w.platforms||[]); const miss=PLATFORMS.filter(p=>have.indexOf(p)<0);
    return '<div class="cov-row"><div class="cov-name">'+esc(w.title)+'</div><div class="cov-miss">漏发：'+miss.map(p=>'<span class="chip chip-tag">'+esc(p)+'</span>').join(' ')+'</div><button class="mini" onclick="act(\'openWorkModal\',\''+encId(w.id)+'\')">补发</button></div>';
  }).join('') : '<div class="today-empty">🎉 全部作品均已覆盖全平台，分发很稳</div>';
  const platCovHtml = '<div class="chart-card full" style="border-color:'+(covRate>=80?'var(--green)':'var(--orange)')+'"><h3>🌐 全平台覆盖（你全平台分发）</h3>'
    + '<div class="kpi-row" style="margin-bottom:10px">'
    + '<div class="kpi"><b>'+allPlatWorks.length+'/'+allWorks.length+'</b><span>全平台作品</span></div>'
    + '<div class="kpi"><b style="color:'+(covRate>=80?'var(--green)':'var(--orange)')+'">'+covRate+'%</b><span>覆盖率</span></div>'
    + '<div class="kpi"><b>'+partial.length+'</b><span>待补发</span></div>'
    + '</div>'
    + '<div style="font-size:13px;color:var(--ink);margin-bottom:6px">⚠ 仅发部分平台的作品（建议补发，保证全平台一致）：</div>'
    + partialHtml
    + '</div>';

  // ===== 选题命中率 & 来源转化 =====
  const ideasAll=safeArr(state.ideas);
  const planN=ideasAll.length;
  const schedN=ideasAll.filter(i=>i.status>=2).length;
  const pubN=ideasAll.filter(i=>i.status===3).length;
  const hitRate = planN? Math.round(pubN/planN*100):0;
  const byKind={material:{n:0,plays:0},idea:{n:0,plays:0},direct:{n:0,plays:0}};
  dataWorks.forEach(w=>{ const k=(w.origin&&w.origin.kind)||'direct'; if(!byKind[k])byKind[k]={n:0,plays:0}; byKind[k].n++; byKind[k].plays+=(wm(w).plays); });
  const kindRows=['material','idea','direct'].map(k=>{ const o=byKind[k]; const name=k==='material'?'素材来源':k==='idea'?'灵感来源':'直接记录'; const avg=o.n?fmt(Math.round(o.plays/o.n)):'0'; return `<div class="bar-row"><div class="bar-label">${name}</div><div class="bar-track"><div class="bar-fill" style="width:${o.n?Math.round(o.n/Math.max(1,dataWorks.length)*100):0}%;background:#7C8FE0"></div></div><div class="bar-val">${o.n} 条 · 均播 ${avg}</div></div>`; }).join('');
  const sourceHtml=`<div class="chart-card full"><h3>🎯 选题命中率 & 来源转化</h3>
    <div class="kpi-row" style="margin-bottom:10px">
      <div class="kpi"><b>${planN}</b><span>灵感总数</span></div>
      <div class="kpi"><b>${schedN}</b><span>已排期</span></div>
      <div class="kpi"><b style="color:var(--green)">${pubN}</b><span>已发布</span></div>
      <div class="kpi"><b style="color:${hitRate>=50?'var(--green)':'var(--orange)'}">${hitRate}%</b><span>灵感命中率</span></div>
    </div>
    <div style="font-size:13px;color:var(--ink);margin-bottom:6px">作品按来源的平均播放（哪类选题真正跑得好）：</div>
    ${kindRows}
    <div style="font-size:11.5px;color:var(--ink2);margin-top:6px">命中率 = 已发布灵感 ÷ 灵感总数；来源转化看各渠道作品数与平均播放，回答「为什么爆、哪类选题真发了」</div>
  </div>`;

  box.innerHTML=`
    ${platTabHtml}
    ${platSpecific}
    <div class="kpi-row">
      <div class="kpi"><b>${works.length}</b><span>作品总数</span></div>
      <div class="kpi"><b>${fmt(totalPlays)}</b><span>总播放</span></div>
      <div class="kpi"><b>${fmt(totalInter)}</b><span>总互动</span></div>
      <div class="kpi"><b>${avgInterRate.toFixed(1)}%</b><span>平均互动率</span></div>
      <div class="kpi"><b style="color:${bestCol.color}">${bestCol.name.slice(2)}</b><span>最佳合集</span></div>
      <div class="kpi hot"><b>${hotCount}</b><span>爆款数</span></div>
    </div>
    <div class="strat-tip">${tip}</div>
    <div class="chart-grid">
      <div class="chart-card"><h3>各合集作品数</h3>${barSvg}</div>
      <div class="chart-card"><h3>各合集互动占比</h3>${donutSvg}<div class="legend">${legend}</div></div>
      <div class="chart-card full"><h3>发布趋势（近 6 个月）</h3>${lineSvg}</div>
      <div class="chart-card"><h3>各合集互动率对比</h3>${colRateBars}<div style="font-size:11.5px;color:var(--ink2);margin-top:6px">互动率 = 互动数 ÷ 播放（越高越共鸣）</div></div>
      <div class="chart-card"><h3>形式对比（视频/图文）</h3>${formBars}</div>
      ${platDistHtml}
      ${platCovHtml}
      <div class="chart-card full"><h3>发布星期热力（平均互动率）</h3><div class="heat-grid">${heatCells}</div></div>
      <div class="chart-card full"><h3>播放 Top 5 作品</h3>${topHtml}</div>
      <div class="chart-card full"><h3>🔥 爆款内容公式</h3>${formula}</div>
      ${sourceHtml}
    </div>`;
}

/* ============ 内容日历 + 作品扩展字段 ============ */
/* 基础限流/敏感词库（可自行补充；仅作发布前提醒，非平台官方词表） */
const SENSITIVE_WORDS = ['第一','最','唯一','顶级','国家级','全国第一','史无前例','100%','免费领取','加微信','扫码','私聊','秒杀','转发','关注我','公众号','二维码','赚钱','日赚','兼职','招商','加盟','领红包','私信','紧急通知','震惊','绝对','万能','根治','偏方','特效','立即见效','点击链接','限时免费','元优惠券'];

let calMonth = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let calSel = null;
function calGo(delta){ const [y,m]=calMonth.split('-').map(Number); let nm=m+delta, ny=y; while(nm<1){nm+=12;ny--;} while(nm>12){nm-=12;ny++;} calMonth=ny+'-'+String(nm).padStart(2,'0'); renderCalendar(); }
function calToday(){ calMonth=todayStr().slice(0,7); calSel=null; renderCalendar(); }
function calSelect(ds){ calSel=ds; renderCalendar(); }
/* ===== 内容日历 ↔ 作品 / 灵感 双向联动 ===== */
function jumpToCalendar(ds){ if(!ds) return; calMonth=ds.slice(0,7); calSel=ds; switchTab('calendar'); }
function calViewWorks(ds){ state.dateFilter=ds; switchTab('works'); }
function calViewIdeas(ds){ state.dateFilter=ds; switchTab('ideas'); }
function clearDateFilter(){ state.dateFilter=null; if(curTab==='works') renderWorks(); else if(curTab==='ideas') renderIdeas(); else switchTab('works'); }
function calNewIdea(ds){ openIdeaModal(null, ds); }
function calNewWork(ds){ openWorkModal(null, ds); }
function updateCalBadge(){ const b=document.getElementById('calBadge'); if(!b) return; const due=safeArr(state.ideas).filter(i=>i.status!==3 && i.planDate && i.planDate<=todayStr()).length; if(due>0){ b.textContent=due; b.style.display='inline-flex'; } else b.style.display='none'; }
function wm0(w){ return dataPlat==='全部' ? mainMetrics(w) : getPlatMetrics(w,dataPlat); }
function renderCalendar(){
  const box=document.getElementById('calendarBox'); if(!box) return;
  const [y,m]=calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1), startDow=first.getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const today=todayStr();
  const pub={}, plan={}, pubList={}, planList={};
  safeArr(state.works).forEach(w=>{ if(w.date){ pub[w.date]=(pub[w.date]||0)+1; (pubList[w.date]=pubList[w.date]||[]).push(w); } });
  safeArr(state.ideas).forEach(i=>{ if(i.planDate && i.status!==3){ plan[i.planDate]=(plan[i.planDate]||0)+1; (planList[i.planDate]=planList[i.planDate]||[]).push(i); } });
  const dowNames=['日','一','二','三','四','五','六'].map((n,i)=>`<div class="cal-dow${i===0||i===6?' we':''}">${n}</div>`).join('');
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===today, isSel=ds===calSel;
    const pb=pub[ds]||0, pn=plan[ds]||0;
    const pws=(pubList[ds]||[]), pis=(planList[ds]||[]);
    const pubHtml = pb ? `<div class="cal-pub">${pws.slice(0,2).map(w=>{const c=colOf(w.collection);return `<div class="cal-pt" title="${esc(w.title||'')}"><span class="cal-col" style="--cc:${c.color}">${esc(c.key)}</span><span class="cal-txt">${esc(w.title||'')}</span></div>`;}).join('')}${pb>2?`<div class="cal-pmore">＋${pb-2} 已发布</div>`:''}</div>` : '';
    const planHtml = pn ? `<div class="cal-plan">${pis.slice(0,1).map(i=>{const c=colOf(i.collection);return `<div class="cal-pt plan" title="${esc(i.content||'')}"><span class="cal-col" style="--cc:${c.color}">${esc(c.key)}</span><span class="cal-txt">${esc(i.content||'')}</span></div>`;}).join('')}${pn>1?`<div class="cal-pmore">＋${pn-1} 排期</div>`:''}</div>` : '';
    cells+=`<div class="cal-cell ${isToday?'today':''} ${isSel?'sel':''}" onclick="calSelect('${ds}')">
      <div class="cal-d">${d}</div>
      ${pubHtml}${planHtml}
    </div>`;
  }
  const trailing=((7-(startDow+daysInMonth)%7)%7);
  for(let i=0;i<trailing;i++) cells+='<div class="cal-cell empty"></div>';
  box.innerHTML=`<div class="cal-head">
      <button class="btn btn-soft" onclick="calGo(-1)" title="上个月">‹</button>
      <b class="cal-title">${y} 年 ${m} 月</b>
      <div class="cal-head-right">
        <button class="btn btn-soft" onclick="calGo(1)" title="下个月">›</button>
        <button class="btn btn-soft" onclick="calToday()" title="回到本月">本月</button>
      </div>
    </div>
    <div class="cal-grid-h">${dowNames}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span><i class="cal-b pub">●</i> 已发布主题（实心点）</span><span><i class="cal-b plan">○</i> 待发布主题（灵感排期）</span></div>`;
  renderCalDetail(); updateCalBadge();
}
function renderCalDetail(){
  const box=document.getElementById('calDetail'); if(!box) return;
  const ds=calSel;
  if(!ds){ box.innerHTML='<div class="cal-detail-empty">点上方日期，看当天已发布 / 待发布的作品清单</div>'; return; }
  const pubWorks=safeArr(state.works).filter(w=>w.date===ds);
  const planIdeas=safeArr(state.ideas).filter(i=>i.planDate===ds && i.status!==3);
  let html=`<div class="cal-detail-day">${esc(ds)}</div>`;
  let sec='';
  if(planIdeas.length){ sec+='<div class="cal-sec">📌 待发布（'+planIdeas.length+'）<button class="mini" style="float:right;min-height:30px" onclick="calViewIdeas(\''+ds+'\')">在灵感库查看 ›</button></div>'+planIdeas.map(i=>`<div class="cal-item"><span class="badge badge-today">${colOf(i.collection).name}</span><div class="ci-main"><div class="ci-title">${esc(i.content)}</div><div class="ci-sub">${esc(STATUS[Number(i.status)]||'')} · 来源 ${esc(i.source||'—')}</div></div><button class="mini" onclick="act('publishFromIdea','${encId(i.id)}')">发布</button></div>`).join(''); }
  if(pubWorks.length){ sec+='<div class="cal-sec">📅 已发布（'+pubWorks.length+'）<button class="mini" style="float:right;min-height:30px" onclick="calViewWorks(\''+ds+'\')">在作品库查看 ›</button></div>'+pubWorks.map(w=>`<div class="cal-item"><span class="badge badge-done">${colOf(w.collection).name}</span><div class="ci-main"><div class="ci-title">${esc(w.title)}</div><div class="ci-sub">${fmt(wm0(w).plays)} 播放 · ${esc(w.date)}</div></div><button class="mini" onclick="act('openWorkModal','${encId(w.id)}')">查看</button></div>`).join(''); }
  if(!sec){ sec=`<div class="cal-detail-empty">${esc(ds)} 暂无安排</div>`; }
  html+=sec;
  html+=`<div class="cal-jump"><button class="mini" onclick="calNewIdea('${ds}')">＋ 排期灵感</button><button class="mini" onclick="calNewWork('${ds}')">＋ 新建作品</button></div>`;
  box.innerHTML=html;
}

    <input id="f_title2" placeholder="候选标题 2（如：竹杖芒鞋轻胜马，谁怕？）" value="${w?esc(a[0]||''):''}">
    <input id="f_title3" placeholder="候选标题 3（如：苏轼教我笑着淋雨）" value="${w?esc(a[1]||''):''}" style="margin-top:6px">

}
/* 按平台差异化文案（抖音口语 / 小红书情绪 / B站深度） */
function platTextHTML(w){
  const cur=w&&w.platText||{};
  return `<details class="collapse"><summary>✍️ 按平台差异化文案（抖音 / 小红书 / B站 文案不同，打开率差很多）</summary>
    <div class="plat-text-box">${PLATFORMS.map(p=>`<div class="pt-row"><b>${p}</b><textarea id="f_pt_${p}" placeholder="${p} 专属文案（留空则用主文案）">${esc(cur[p]||'')}</textarea></div>`).join('')}</div>

/* 发布前合规自检 + 发布 Checklist */
function complianceHTML(){
  return `<div class="field"><label>发布前合规自检（限流词 / 敏感词提醒）</label>
    <div id="complianceBox" class="compliance-box">输入标题 / 文案后自动检测…</div>
  </div>
  <div class="field"><label>发布 Checklist</label>
    <div class="checklist">
      <label><input type="checkbox"> #话题标签已加</label>
      <label><input type="checkbox"> @ / 定位已设</label>
      <label><input type="checkbox"> 评论区引导已写</label>
      <label><input type="checkbox"> 封面文案已定</label>
    </div>
  </div>`;
}
function runCompliance(){
  const box=document.getElementById('complianceBox'); if(!box) return;
  const title=fieldVal('f_title'), text=fieldVal('f_text');
  const hit=SENSITIVE_WORDS.filter(k=> (title+' '+text).includes(k));
  if(!title && !text){ box.className='compliance-box'; box.innerHTML='输入标题 / 文案后自动检测…'; return; }
  if(!hit.length){ box.className='compliance-box ok'; box.innerHTML='✓ 未发现明显限流 / 敏感词'; }
  else { box.className='compliance-box bad'; box.innerHTML='⚠ 疑似限流 / 敏感词：'+hit.map(k=>'<span class="kw">'+esc(k)+'</span>').join('')+'（请斟酌是否保留）'; }
}
function collectWorkExtras(rec){
  const t2=fieldVal('f_title2').trim(), t3=fieldVal('f_title3').trim();
  rec.altTitles=[t2,t3].filter(Boolean);
  const pt={}; PLATFORMS.forEach(p=>{ const v=fieldVal('f_pt_'+p).trim(); if(v) pt[p]=v; });
  rec.platText=pt;
}

/* ============ 弹窗 ============ */
function closeModal(){ document.getElementById('overlay').classList.remove('show'); editing=null; }
function openModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('overlay').classList.add('show'); refreshTagSuggest(); }

function colOptions(sel){ return COLLECTIONS.map(c=>`<option value="${c.key}" ${c.key===sel?'selected':''}>${c.name}</option>`).join(''); }
function platChecks(sels){ return PLATFORMS.map(p=>`<label class="check ${sels&&sels.includes(p)?'on':''}"><input type="checkbox" value="${p}" ${sels&&sels.includes(p)?'checked':''} onchange="this.parentElement.classList.toggle('on',this.checked);refreshTagSuggest();renderPlatMetricsBox()">${p}</label>`).join(''); }
/* ===== 各平台独立指标 ===== */
function getPlatMetrics(w, plat){
  if(w && w.metrics && w.metrics[plat]) return w.metrics[plat];
  return {plays:Number(w&&w.plays)||0, likes:Number(w&&w.likes)||0, favs:Number(w&&w.favs)||0, comments:Number(w&&w.comments)||0};
}
function aggregatePlat(works, plat){
  const def=PLAT_METRICS[plat]||[]; const agg={}; def.forEach(([k])=>agg[k]=0);
  works.forEach(w=>{ const m=getPlatMetrics(w,plat); def.forEach(([k])=>{ if(m[k]!=null) agg[k]=(Number(agg[k])||0)+(Number(m[k])||0); }); });
  return agg;
}
function platMetricsHTML(plats, data){
  if(!plats||!plats.length) return '<div class="item-sub" style="color:var(--ink2)">勾选上方发布平台后，这里会出现各平台的专属数据输入框（抖音含分享/完播率，B站含投币/弹幕，小红书含曝光/涨粉…）</div>';
  return plats.map(p=>{
    const def=PLAT_METRICS[p]||[]; const m=(data&&data.metrics&&data.metrics[p])||{};
    const fields=def.map(([k,name])=>`<div class="field"><label>${name}</label><input data-p="${p}" data-k="${k}" type="number" inputmode="numeric" value="${m[k]!=null?esc(m[k]):''}"></div>`).join('');
    return `<div class="plat-metric-card"><div class="pmc-head">📊 ${p}<button type="button" class="mini pmc-copy" onclick="copyPlatMetrics('${p}')" title="把本平台数据复制到其他已勾选平台（仅复制共有字段）">⧉ 复制到其他</button></div><div class="row2">${fields}</div></div>`;
  }).join('');
}
function renderPlatMetricsBox(){
  const box=document.getElementById('platMetrics'); if(!box) return;
  const draft=editing&&editing.draft?editing.draft:{};
  box.querySelectorAll('input[data-k]').forEach(el=>{ const p=el.dataset.p,k=el.dataset.k; draft[p]=draft[p]||{}; draft[p][k]=Number(el.value)||0; });
  if(editing) editing.draft=draft;
  const plats=[...document.querySelectorAll('#f_plats input:checked')].map(i=>i.value);
  box.innerHTML=platMetricsHTML(plats,{metrics:draft});
}
function collectPlatMetrics(plats){
  const draft=editing&&editing.draft||{}; const metrics={};
  (plats||[]).forEach(p=>{ metrics[p]=draft[p]||{}; }); return metrics;
}
function copyPlatMetrics(src){
  // 先收集当前所有输入框到 draft
  const draft=editing&&editing.draft?JSON.parse(JSON.stringify(editing.draft)):{};
  document.querySelectorAll('#platMetrics input[data-k]').forEach(el=>{ const p=el.dataset.p,k=el.dataset.k; draft[p]=draft[p]||{}; draft[p][k]=Number(el.value)||0; });
  const srcVals=draft[src]||{};
  const others=[...document.querySelectorAll('#f_plats input:checked')].map(i=>i.value).filter(p=>p!==src);
  if(!others.length){ flashToast('请先在其他平台也勾选发布'); return; }
  others.forEach(p=>{
    const def=PLAT_METRICS[p]||[]; const keys=def.map(([k])=>k);
    draft[p]=draft[p]||{};
    keys.forEach(k=>{ if(srcVals[k]!=null && srcVals[k]!=='') draft[p][k]=srcVals[k]; }); // 仅复制共有字段
  });
  if(editing) editing.draft=draft;
  renderPlatMetricsBox();
  flashToast('已把「'+src+'」的共有指标复制到 '+others.length+' 个平台');
}
function summarizeToMain(rec){
  let plays=0,likes=0,favs=0,comments=0;
  Object.keys(rec.metrics||{}).forEach(p=>{ const m=rec.metrics[p]||{}; plays+=(Number(m.plays)||0); likes+=(Number(m.likes)||0); favs+=(Number(m.favs)||0); comments+=(Number(m.comments)||0); });
  rec.plays=plays; rec.likes=likes; rec.favs=favs; rec.comments=comments; return rec;
}

/* 作品数据回填优化：发布后才回填，不逼手填；看板只汇总已回填作品 */
function workHasData(w){
  if(!w) return false;
  const m=w.metrics||{};
  for(const p in m){ const o=m[p]||{}; for(const k in o){ if(Number(o[k])>0) return true; } }
  if((Number(w.plays)||0)+(Number(w.likes)||0)+(Number(w.favs)||0)+(Number(w.comments)||0)>0) return true;
  return false;
}
function syncMetricsInputsToDraft(){
  if(!editing) return;
  const d=editing.draft||{};
  document.querySelectorAll('#platMetrics input[data-k]').forEach(el=>{ const p=el.dataset.p,k=el.dataset.k; d[p]=d[p]||{}; d[p][k]=Number(el.value)||0; });
  editing.draft=d;
}
function metricsCollapseHTML(plats, draft, open){
  return `<div class="metric-collapse">
    <div class="mc-head${open?' open':''}" id="metricsHead" onclick="toggleMetricsBox()">
      <span>📊 各平台数据 <small>（发布后从平台后台回填，可先留空）</small></span>
      <span class="mc-arrow">▸</span>
    </div>
    <div id="platMetricsWrap" class="mc-body"${open?'':' style="display:none"'}>
      <div id="platMetrics">${platMetricsHTML(plats,{metrics:draft})}</div>
      <div class="item-sub" style="color:var(--ink2);margin-top:6px">📌 暂时不填也没关系：发布后去各平台后台看一眼，点作品卡「回填数据」即可。看板只汇总已回填的作品。</div>
    </div>
  </div>`;
}
function toggleMetricsBox(){
  const el=document.getElementById('platMetricsWrap'); if(!el)return;
  const willOpen=el.style.display==='none';
  el.style.display=willOpen?'':'none';
  const hd=document.getElementById('metricsHead'); if(hd) hd.classList.toggle('open',willOpen);

function openFillMetrics(id){
  const w=state.works.find(x=>x.id===id); if(!w)return;
  let draft={}; if(w.metrics) draft=JSON.parse(JSON.stringify(w.metrics)); else (w.platforms||['抖音']).forEach(p=>{ draft[p]=getPlatMetrics(w,p); });
  editing={type:'work',id:id,draft:draft};
  const html=`<h3>回填数据 · ${esc(w.title)}</h3>
    <div class="banner" style="margin-bottom:10px">📡 发布后去各平台后台看一眼数据，回来填这里。看板会自动汇总已回填作品，不影响其他字段。</div>
    <div class="field"><label>发布平台（多选）</label><div class="checks" id="f_plats">${platChecks(w.platforms)}</div><div class="item-sub" style="margin-top:2px;color:var(--ink2)">默认全平台同步发布，可按需取消勾选</div></div>
    <div id="platMetrics">${platMetricsHTML(w.platforms,{metrics:draft})}</div>
    <div class="modal-actions">
      <button class="btn btn-line" onclick="closeModal()">取消</button>

function saveFillMetrics(){
  syncMetricsInputsToDraft();
  const plats=[...document.querySelectorAll('#f_plats input:checked')].map(i=>i.value);
  const w=state.works.find(x=>x.id===editing.id); if(!w)return;
  w.platforms=plats; w.metrics=collectPlatMetrics(plats); summarizeToMain(w);
  save(); closeModal(); renderWorks(); renderData(); renderToday();
  flashToast('数据已回填，看板已更新');
}

    <h3>${w?'编辑作品':'记录新作品'} <span style="font-size:12px;font-weight:500;color:var(--ink2)">· 防重复核心</span></h3>

function liveDupCheck(){
  const title=document.getElementById('f_title').value;
  const tags=(document.getElementById('f_tags').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const hits=findSimilar(title,tags,editing?editing.id:null);
  const box=document.getElementById('dupWarn');
  if(hits.length){
    box.classList.add('show');
    box.innerHTML='<b>⚠ 可能与已发作品重复：</b><br>'+hits.map(h=>`• ${esc(h.title)}（${h.date} · ${colOf(h.collection).name}）`).join('<br>');
  } else box.classList.remove('show');
}
function fieldVal(id){ const el=document.getElementById(id); return el && el.value!=null ? String(el.value) : ''; }
function saveWork(){
  const get=fieldVal;
  const plats=[...document.querySelectorAll('#f_plats input:checked')].map(i=>i.value);
  const tags=get('f_tags').split(',').map(s=>s.trim()).filter(Boolean);
  const rec={
    collection:get('f_col')||'碎语', title:get('f_title').trim(), text:get('f_text').trim(),
    form:get('f_form')||'视频', date:get('f_date'), duration:get('f_dur').trim(), bgm:get('f_bgm').trim(),
    platforms:plats, tags,
    metrics:(syncMetricsInputsToDraft(), collectPlatMetrics(plats))
  };
  summarizeToMain(rec);
  collectWorkExtras(rec);
  if(!rec.title){ alert('请填写标题'); return; }
  const eid = editing && editing.id ? editing.id : null;
  const idx = eid ? state.works.findIndex(x=>x && x.id===eid) : -1;
  if(idx>=0){ rec.origin = (state.works[idx] && state.works[idx].origin) || null; state.works[idx]={...state.works[idx],...rec}; }
  else { rec.id = eid || uid(); rec.createdAt=Date.now(); state.works.unshift(rec); }
  syncTagPoolFromSelf(rec.title, rec.text, rec.collection, rec.tags, Date.now()); save(); closeModal(); renderWorks(); renderToday(); renderData(); renderCalendar(); updateCalBadge(); if(document.getElementById('tagSuggest')) refreshTagSuggest();

/* ============ 云同步（GitHub） ============ */
function loadCloud(){
  try{ const raw=localStorage.getItem(CLOUD_KEY); if(raw){ const c=JSON.parse(raw); return Object.assign({token:'',repo:'',path:'data/wfyy.json',enabled:false,lastSha:null,lastSync:'',autoSync:true}, c); } }catch(e){}
  return {token:'',repo:'',path:'data/wfyy.json',enabled:false,lastSha:null,lastSync:'',autoSync:true};
}
function saveCloud(){ try{ localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)); }catch(e){} }
function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob((s||'').replace(/\s/g,'')))); }
function encPath(p){ return (p||'').split('/').map(encodeURIComponent).join('/'); }
/* 隐私防护：检测云同步仓库是否为「公开仓库」（无需 token 即可读取 = 个人数据裸奔）。
   公开仓库通过 raw.githubusercontent.com 任何人都能下载 data/wfyy.json 并解码出全部作品/灵感。 */
async function checkRepoPublic(repo){
  try{
    const res = await fetch('https://api.github.com/repos/'+repo, { method:'GET', headers:{'Accept':'application/vnd.github+json'} });
    return res.status===200; // 200 = 公开可读（无 token）；404 = 私有/无权限
  }catch(e){ return false; }
}
/* 推测当前 Pages 所在的仓库（用于警告"不要拿托管页面的公开仓库当同步仓"） */
function guessPagesRepo(){
  try{
    const h=location.hostname, p=location.pathname;
    if(h.endsWith('.github.io')){
      const owner=h.replace(/\.github\.io$/,'');
      const seg=(p||'/').split('/').filter(Boolean)[0];
      if(seg) return owner+'/'+seg; // 项目页：owner/首个路径段
      return owner+'.github.io';     // 用户页
    }
  }catch(e){}
  return '';
}
/* 安全 JSON 解析：统一抛清晰错误，避免裸 JSON.parse 暴露 InvalidCharacterError 等底层异常 */
function safeJSONParse(s, label){ try{ return JSON.parse(s); }catch(e){ throw new Error((label||'数据')+'解析失败（可能已损坏或格式不对）'); } }
function nowHM(){ return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }

async function ghFetch(path, method, body){
  const res = await fetch('https://api.github.com'+path, {
    method: method||'GET',
    headers: {
      'Authorization':'Bearer '+cloud.token,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json',
      'X-GitHub-Api-Version':'2022-11-28'
    },
    body: body?JSON.stringify(body):undefined
  });
  if(res.status===204) return null;
  let json=null; try{ json=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((json&&json.message)||res.statusText||('HTTP '+res.status)); err.status=res.status; throw err; }
  return json;
}

function normalizeState(d){
  d=(d && typeof d==='object' && !Array.isArray(d))?d:{};
  const hot=safeArr(d.hotTopics), pool=safeArr(d.tagPool);
  return {

    ideas: safeArr(d.ideas),
    materials: safeArr(d.materials),
    hotTopics: hot.length?hot:HOT_SEED(),
    tagPool: pool.length?pool:TAG_SEED(),
    activeCol: d.activeCol||null,
    tagUpdated: d.tagUpdated||null
  };
}

function setCloudStatus(msg, type){

function schedulePush(){
  if(!cloud.enabled || !booted || syncing) return;

async function cloudPush(){
  if(!cloud.token || !cloud.repo){ setCloudStatus('请先填写令牌和仓库并保存配置','warn'); return; }
  const content = b64encode(JSON.stringify(state));
  const url = '/repos/'+cloud.repo+'/contents/'+encPath(cloud.path);
  try{
    let sha = cloud.lastSha;
    if(!sha){ try{ const r=await ghFetch(url,'GET'); if(r&&r.sha) sha=r.sha; }catch(e){} }
    const res = await ghFetch(url,'PUT', { message:'sync 晚风予言工作台 '+new Date().toISOString(), content:content, sha: sha||undefined });
    if(res && res.content && res.content.sha){ cloud.lastSha=res.content.sha; }
    cloud.lastSync=nowHM(); saveCloud();
    setCloudStatus('已上传到云端 · '+cloud.lastSync,'ok');
  }catch(err){
    if(err.status===409){
      try{
        const r=await ghFetch(url,'GET'); cloud.lastSha=r.sha;
        const res2=await ghFetch(url,'PUT',{message:'sync merge',content:content,sha:cloud.lastSha});
        if(res2&&res2.content) cloud.lastSha=res2.content.sha;
        cloud.lastSync=nowHM(); saveCloud();
        setCloudStatus('已上传（合并冲突）· '+cloud.lastSync,'ok');
      }catch(e2){ setCloudStatus('上传失败：'+(e2.message||''),'err'); }
    } else {
      setCloudStatus('上传失败：'+(err.message||('HTTP '+(err.status||''))),'err');
    }
  }
}

async function cloudPull(){
  if(!cloud.token || !cloud.repo){ setCloudStatus('请先填写令牌和仓库并保存配置','warn'); return; }
  const url='/repos/'+cloud.repo+'/contents/'+encPath(cloud.path);
  try{
    const r=await ghFetch(url,'GET');
    if(!r || !r.content){ cloud.lastSync=nowHM(); saveCloud(); setCloudStatus('云端暂无数据，已上传本机','warn'); await cloudPush(); return; }
    const data=safeJSONParse(b64decode(r.content), '云端数据');
    syncing=true;
    state=normalizeState(data);
    save();
    syncing=false;
    cloud.lastSha=r.sha; cloud.lastSync=nowHM(); saveCloud();
    renderAll();
    setCloudStatus('已从云端下载 · '+cloud.lastSync,'ok');
  }catch(err){
    if(err.status===404){ cloud.lastSync=nowHM(); saveCloud(); setCloudStatus('云端为空，已上传本机数据','warn'); await cloudPush(); }
    else { setCloudStatus('下载失败：'+(err.message||('HTTP '+(err.status||''))),'err'); }
  }
}

/* 自动同步：本地有改动自动上传，云端有更新（来自其他设备）自动拉取，不互相覆盖 */
async function cloudAutoSync(){
  if(!cloud.enabled || !cloud.autoSync || !booted || syncing) return;
  try{
    if(cloudDirty){
      await cloudPush(); cloudDirty=false;
    } else {
      const url='/repos/'+cloud.repo+'/contents/'+encPath(cloud.path);
      const r=await ghFetch(url,'GET');
      if(r && r.sha && r.sha!==cloud.lastSha) await cloudPull(); // 云端有更新，拉取合并到本地
    }
  }catch(e){ /* 静默失败，下次间隔再试 */ }
}
async function cloudTest(){
  if(!cloud.token || !cloud.repo){ setCloudStatus('请先填写令牌和仓库','warn'); return; }
  try{
    const r=await ghFetch('/repos/'+cloud.repo,'GET');
    cloud.lastSync=nowHM(); saveCloud();
    let extra='';
    if(await checkRepoPublic(cloud.repo)){

    }
    setCloudStatus('连接成功：'+(r.full_name||cloud.repo)+extra, extra?'warn':'ok');
  }catch(e){ setCloudStatus('连接失败：'+(e.message||('HTTP '+(e.status||''))),'err'); }
}

/* ============ 每日自动更新热点库 ============
   复用云同步 PAT（cloud.token，对该仓 contents:write），每天首次打开时把
   「治愈系精选骨架 + 当日实时热榜钩子」推回仓库 data/hot.json。
   无需新令牌；任何失败都静默降级，绝不弹「联网失败」、绝不丢内容。 */
const HOT_PUSH_KEY = 'wb_wfyy_hotpush_v1';
function hotPushCfg(){
  try{ return Object.assign({enabled:true, lastDate:''}, JSON.parse(localStorage.getItem(HOT_PUSH_KEY)||'{}')); }catch(e){ return {enabled:true, lastDate:''}; }
}
async function autoPushHotJson(opts){
  opts = opts || {};
  const silent = !!opts.silent;
  const fail = (msg)=>{ if(!silent) flashToast(msg); console.warn('[autoPushHot]', msg); return false; };
  try{
    const c = loadCloud();
    if(!c || !c.token || !c.repo){ return fail('未配置云同步，无法自动更新热点库'); }
    const owner = c.repo.split('/')[0], repo = c.repo.split('/')[1];
    if(!owner || !repo) return fail('仓库格式应为 owner/repo');
    /* 用当前云同步凭据（保证与 ghFetch 一致） */
    cloud.token = c.token; cloud.repo = c.repo;
    /* 1) 现有精选骨架（tag 不为「实时」的稳定内容） */
    let base = [];
    try{ const items = await fetchHotJson(); base = (items||[]).filter(it=> (it&&it.tag)!=='实时'); }catch(e){ base = []; }
    if(!base.length){ base = safeArr(state.hotTopics).filter(h=>!h.live).map(h=>({title:h.title,col:(h.col&&h.col.name)||'碎语',plat:'',tag:(h.tags&&h.tags[0])||'',angle:h.angle||''})); }
    /* 2) 当日实时热榜（最佳努力，失败不影响骨架） */
    let fresh = [];
    try{
      const live = await fetchLiveTrending();
      const seen = new Set(base.map(b=>b.title));
      (Array.isArray(live)?live:[]).slice(0,8).forEach(t=>{
        const title = String((t&&(t.title||t.t))||'').trim();
        if(!title || seen.has(title)) return; seen.add(title);
        fresh.push({ title:title, col:'碎语', plat:String((t&&t.plat)||''), tag:'实时', angle:'实时热点钩子 · 网友正在讨论，可切入你的治愈系视角' });
      });
    }catch(e){ console.warn('[autoPushHot] 实时热榜获取失败，仅更新精选骨架：', e&&e.message); }
    /* 3) 合并，去重，限量（骨架稳定 + 实时每日刷新，总量封顶 40） */
    const seen2 = new Set(); const merged = [];
    base.concat(fresh).forEach(it=>{ const k=(it&&it.title)||''; if(!k || seen2.has(k)) return; seen2.add(k); merged.push(it); });
    const payload = { updatedAt: todayStr(), note:'晚风予言 · 每日自动更新热点库（GitHub raw 托管）', items: merged.slice(0,40) };
    /* 4) 推回仓库（取 sha 后 PUT，复用云同步 PAT）。
       同时写 data/hot.json（仓根，raw 容错首源）与 wfyy/hot.json（Pages 同域 ./hot.json），
       让 GitHub Pages 版也每天自动换新，与出差/拼豆托管一致。 */
    const pushPaths = ['data/hot.json','wfyy/hot.json'];
    const content = b64encode(JSON.stringify(payload,null,2));
    let okCount = 0;
    for(const p of pushPaths){
      const ap = '/repos/'+owner+'/'+repo+'/contents/'+encPath(p);
      let sha; try{ const r=await ghFetch(ap,'GET'); if(r&&r.sha) sha=r.sha; }catch(e){}
      try{
        await ghFetch(ap,'PUT', { message:'chore(hot): 每日自动更新热点库 '+payload.updatedAt, content, sha: sha||undefined });
        okCount++;
      }catch(e){ console.warn('[autoPushHot] 推送 '+p+' 失败：', e&&e.message); }
    }
    if(okCount===0) return fail('热点库推送失败（所有路径写入失败）');
    if(!silent) flashToast('已更新热点库（'+merged.length+' 条）并推送到仓库');
    return true;
  }catch(e){ return fail('自动更新热点库失败：'+(e&&e.message||e)); }
}
function maybeAutoPushHot(){
  try{
    const cfg = hotPushCfg();
    if(cfg.enabled === false) return;
    const today = todayStr();
    if(cfg.lastDate === today) return;
    if(typeof navigator!=='undefined' && navigator.onLine===false) return;
    autoPushHotJson({silent:true}).then(ok=>{ if(ok) localStorage.setItem(HOT_PUSH_KEY, JSON.stringify({enabled:true, lastDate:today})); });
  }catch(e){}
}

}

/* ===== 批量导入各平台作品 ===== */
let impData=[]; // 当前解析的数据行
const IMP_FIELDS=[
  {key:'collection',label:'合集',req:true, aliases:['合集','栏目','分类','collection','板块','合集/栏目']},
  {key:'title',label:'标题/文案',req:true, aliases:['标题','文案','主题','题目','title','name','名称']},
  {key:'text',label:'文案/简介',req:false, aliases:['文案','简介','描述','正文','text','desc','description','内容']},
  {key:'form',label:'形式',req:false, aliases:['形式','类型','form','type']},
  {key:'platforms',label:'发布平台',req:false, aliases:['平台','发布平台','platform','platforms']},
  {key:'date',label:'发布日期',req:false, aliases:['日期','发布日期','发布时间','date','time','时间']},
  {key:'plays',label:'播放量',req:false, aliases:['播放','播放量','播放数','plays','views','展现','阅读','阅读量']},
  {key:'likes',label:'点赞',req:false, aliases:['点赞','赞','likes','赞数']},
  {key:'favs',label:'收藏',req:false, aliases:['收藏','赞藏','favs','favorites','收藏数']},
  {key:'comments',label:'评论',req:false, aliases:['评论','评论数','comments']},
  {key:'duration',label:'时长',req:false, aliases:['时长','duration']},
  {key:'bgm',label:'配乐/BGM',req:false, aliases:['bgm','配乐','音乐','背景音乐']},
  {key:'tags',label:'标签',req:false, aliases:['标签','tags','keywords','关键字']}
];
function parseCSV(text){
  const lines=text.split(/\r?\n/);
  const first=(lines.find(l=>l.trim())||'');
  const delim=(first.indexOf('\t')>=0 && (first.indexOf(',')<0 || first.split('\t').length>first.split(',').length))?'\t':',';
  const rows=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===delim){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c!=='\r') field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function autoMap(header){
  const norm=s=>String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,'');
  /* 比率类表头（点赞率 / 完播率 / 互动占比 / rate…）不能占用「数量」字段 */
  const RATE=/(率|占比|百分比|比例|均值|平均|rate|ratio|avg|%)/;
  const NUMFIELD={plays:1,likes:1,favs:1,comments:1};
  const hs=(header||[]).map(norm);
  const map={}, used={};
  IMP_FIELDS.forEach(f=>{ map[f.key]=-1; });
  // 第一轮：表头与别名完全相等，优先级最高
  IMP_FIELDS.forEach(f=>{
    for(let i=0;i<hs.length;i++){
      if(used[i]||!hs[i]) continue;
      if(f.aliases.some(a=>norm(a)===hs[i])){ map[f.key]=i; used[i]=1; break; }
    }
  });
  // 第二轮：包含匹配；数量字段跳过比率类表头，且一列只被一个字段占用
  IMP_FIELDS.forEach(f=>{
    if(map[f.key]>=0) return;
    for(let i=0;i<hs.length;i++){
      if(used[i]||!hs[i]) continue;
      if(NUMFIELD[f.key] && RATE.test(hs[i])) continue;
      if(f.aliases.some(a=>hs[i].indexOf(norm(a))>=0)){ map[f.key]=i; used[i]=1; break; }
    }
  });
  return map;
}
function buildImpPreview(text){
  if(!text || !text.trim()){ alert('没有可解析的内容'); return; }
  const rows=parseCSV(text);
  if(rows.length<2){ alert('没解析到数据，至少要有表头 + 1 行内容'); return; }
  const header=rows[0].map(h=>h.trim());
  impData=rows.slice(1);
  const map=autoMap(header);
  if(map.title<0){ alert('没找到「标题」列，请确认表头包含 标题/文案/主题 等。也可点「下载导入模板」对照。'); }
  renderImpMap(map, header, impData);
}
function readImpFile(){
  const f=document.getElementById('impFile').files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>buildImpPreview(r.result);
  r.readAsText(f);
}
function buildImpPreviewFromPaste(){

}
function rowToRec(row, map, srcPlat){
  const col=k=> (map[k]>=0)?(row[map[k]]||'').trim():'';
  let collection=col('collection');
  if(!COLLECTIONS.some(c=>c.key===collection)) collection='碎语';
  const title=col('title');
  if(!title) return null;
  let form=col('form'); if(form!=='视频'&&form!=='图文') form='视频';
  let platforms=(col('platforms')||'').split(/[,，;；、]/).map(s=>s.trim()).filter(Boolean).filter(p=>PLATFORMS.indexOf(p)>=0);
  if(!platforms.length) platforms= srcPlat? [srcPlat] : ['抖音'];
  const tags=(col('tags')||'').split(/[,，;；、]/).map(s=>s.trim()).filter(Boolean);
  const num=k=>{ const v=(col(k)||'').replace(/[,\s，]/g,'').replace(/万$/,'0000'); const n=Number(v); return isNaN(n)?0:Math.max(0,n); };
  const plays=num('plays'), likes=num('likes'), favs=num('favs'), comments=num('comments');
  /* 一行数据只来自一个平台的后台导出，因此指标只落到「数据归属平台」，
     其余平台留空（否则总量会被重复计入 N 次，KPI 虚高 N 倍） */
  let mp = (srcPlat && PLATFORMS.indexOf(srcPlat)>=0) ? srcPlat : platforms[0];
  if(platforms.indexOf(mp)<0) mp = platforms[0];
  const metrics={}; platforms.forEach(p=>{ metrics[p] = (p===mp) ? {plays:plays, likes:likes, favs:favs, comments:comments} : {}; });
  return {
    collection, title, text:col('text'), form, platforms, date:col('date')||todayStr(),
    duration:col('duration'), bgm:col('bgm'), tags,
    plays:plays, likes:likes, favs:favs, comments:comments,
    metrics:metrics
  };
}
function isDupImport(rec){
  const t=(rec.title||'').replace(/\s+/g,'').toLowerCase();
  return state.works.some(w=>{
    const wt=(w.title||'').replace(/\s+/g,'').toLowerCase();
    if(t && wt && t===wt) return true;
    if(w.collection===rec.collection){
      const a=(w.title||'').toLowerCase(), b=(rec.title||'').toLowerCase();
      if(a && b && (a.indexOf(b)>=0||b.indexOf(a)>=0) && b.length>=4) return true;
    }
    return false;
  });
}
function renderImpMap(map, header, dataRows){
  const opt=(key)=> '<option value="-1">— 忽略 —</option>'+header.map((h,i)=>'<option value="'+i+'"'+(map[key]===i?' selected':'')+'>'+esc(h)+'</option>').join('');
  let html='<div class="imp-map"><div class="imp-map-title">③ 确认列对应关系（已自动匹配，可手动调整）</div><div class="imp-grid">';
  IMP_FIELDS.forEach(f=>{
    html+='<div class="imp-row"><span class="imp-label">'+f.label+(f.req?' *':'')+'</span><select class="imp-sel" id="map_'+f.key+'">'+opt(f.key)+'</select></div>';
  });
  html+='</div>';
  const srcPlat=document.getElementById('impSource').value;
  const total=dataRows.length;
  let totalDup=0;
  dataRows.forEach(r=>{ const rec=rowToRec(r,map,srcPlat); if(rec&&isDupImport(rec)) totalDup++; });
  html+='<div class="imp-prev-title">预览（前 '+Math.min(8,total)+' / 共 '+total+' 行）· 重复 '+totalDup+' 条</div><div class="imp-prev">';
  dataRows.slice(0,8).forEach(r=>{
    const rec=rowToRec(r,map,srcPlat); if(!rec) return;
    const d=isDupImport(rec); const c=colOf(rec.collection);
    let chips=rec.platforms.map(p=>'<span class="chip chip-tag">'+esc(p)+'</span>').join('');
    html+='<div class="imp-prev-row'+(d?' dup':'')+'"><span class="col-tag" style="background:'+c.color+'">'+c.name+'</span><b>'+esc(rec.title)+'</b>'+chips+(d?'<span class="imp-dup-flag">⚠ 疑似重复</span>':'')+'</div>';
  });
  html+='</div></div>';
  document.getElementById('impMap').innerHTML=html;
  const acts=document.getElementById('impActions'); acts.style.display='flex';
  const btn=document.getElementById('impBtn'); btn.textContent='导入全部 '+total+' 条';
  let skip=document.getElementById('impSkip');
  if(totalDup>0){
    if(!skip){ skip=document.createElement('button'); skip.id='impSkip'; skip.className='btn btn-soft'; skip.onclick=function(){importWorks(true);}; acts.insertBefore(skip, btn); }
    skip.textContent='跳过重复（'+(total-totalDup)+' 条）'; skip.style.display='';
  } else if(skip){ skip.style.display='none'; }
}
function importWorks(skip){
  const map={}; IMP_FIELDS.forEach(f=>{ map[f.key]=Number(document.getElementById('map_'+f.key).value); });
  const srcPlat=document.getElementById('impSource').value;
  let added=0, skipped=0;
  impData.forEach(row=>{
    const rec=rowToRec(row,map,srcPlat);
    if(!rec){ skipped++; return; }
    if(skip && isDupImport(rec)){ skipped++; return; }
    rec.id=uid(); rec.createdAt=Date.now();
    state.works.unshift(rec); added++;
  });
  save(); closeModal(); renderWorks(); renderData(); renderToday();
  alert('导入完成：新增 '+added+' 条'+(skipped?('，跳过 '+skipped+' 条（空标题或重复）'):'')+'。');
}
