<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>晚风予言 · 创作工作台</title>
<style>
  :root{
    --bg:#FAF8F4; --card:#FFFFFF; --primary:#6B7FD7; --primary-soft:#EEF1FB;
    --accent:#E8A87C; --accent-soft:#FBEee3;
    --ink:#2E2A36; --ink2:#8A8594; --line:#ECE7DF;
    --green:#6BBF8A; --green-soft:#E7F4EC; --red:#E56868; --red-soft:#FBE9E9;
    --orange:#E0A458;
    --r:16px; --shadow:0 4px 18px rgba(107,127,215,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px}
  header.app{
    position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#7C8FE0,#9AA9E8);
    color:#fff;padding:14px 0 12px;box-shadow:0 2px 12px rgba(107,127,215,.18);
  }
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{margin:0;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  .head-actions{display:flex;gap:8px;flex:0 0 auto}
.save-state{font-size:12px;color:rgba(255,255,255,.82);margin-top:5px;line-height:1.4}
.save-state.warn{color:#ffd27d;font-weight:600}
  .btn{
    border:none;border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:.15s;min-height:40px;
  }
  .btn svg{width:16px;height:16px}
  .btn-ghost{background:rgba(255,255,255,.2);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.32)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:#5a6fce}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-soft{background:var(--primary-soft);color:var(--primary)}
  .btn-line{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-danger{background:var(--red-soft);color:var(--red)}

  /* 今天要处理 */
  .today{padding:14px 0 4px}
  .today-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .today-head{display:flex;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(135deg,#FFF6EF,#FDEFE6);border-bottom:1px solid var(--line)}
  .today-head .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .today-head h2{margin:0;font-size:15px;font-weight:700}
  .today-head .count{margin-left:auto;font-size:12px;color:var(--ink2)}
  .today-list{max-height:260px;overflow:auto}
  .today-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f4f0ea}
  .today-item:last-child{border-bottom:none}
  .today-item .badge{flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
  .badge-over{background:var(--red-soft);color:var(--red)}
  .badge-today{background:var(--accent-soft);color:var(--orange)}
  .today-item .ti-main{min-width:0;flex:1}
  .today-item .ti-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .today-item .ti-sub{font-size:12px;color:var(--ink2)}
  .today-empty{padding:18px 14px;text-align:center;color:var(--ink2);font-size:13px}
  .collapsed .today-list{display:none}
  .today-head .toggle{cursor:pointer;color:var(--ink2);font-size:12px;margin-left:8px}

  /* tabs */
  .tabbar{display:flex;gap:6px;margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
  .tab{flex:1;border:none;background:transparent;border-radius:10px;padding:11px 6px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;font-family:inherit}
  .tab svg{width:18px;height:18px}
  .tab.active{background:var(--primary-soft);color:var(--primary)}
  .panel{display:none;animation:fade .2s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* toolbar */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink2)}
  .select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;background:#fff;font-family:inherit;min-height:44px;color:var(--ink)}

  /* 库数量统计条 */
  .lib-stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
  .lib-stats .st-total{font-size:13px;font-weight:700;color:var(--ink);background:var(--bg2);padding:4px 11px;border-radius:999px;cursor:pointer;transition:.15s}
  .lib-stats .st-total.active{background:var(--ink);color:#fff}
  .lib-stats .st-col{font-size:12px;font-weight:600;color:#fff;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;transition:.15s;opacity:.78}
  .lib-stats .st-col:hover{opacity:1}
  .lib-stats .st-col b{font-weight:800;font-size:13px}
  .lib-stats .st-col.active{outline:2px solid var(--ink);outline-offset:1px;opacity:1}
  .lib-stats .st-sep{font-size:12px;color:var(--ink3);margin:0 2px}

  /* cards / items */
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
  .item-top{display:flex;align-items:flex-start;gap:10px}
  .col-tag{flex:0 0 auto;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;color:#fff;white-space:nowrap}
  .item-title{font-size:15px;font-weight:700;margin:0;flex:1;min-width:0}
  .item-sub{font-size:13px;color:var(--ink2);margin-top:4px}
  .item-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--primary-soft);color:var(--primary)}
  .chip-plat{background:#F0ECFA;color:#7a5fc7}
  .chip-cov-all{background:#E7F6EC;color:#2f9e54;font-weight:700}
  .chip-cov-part{background:#FDF1E3;color:#c8841b;font-weight:700}
  .chip-tag{background:#F3F0EA;color:#9a8f7a}
  .chip-date{background:#EFF3F6;color:#5b7c93}
  .item-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
  .mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;min-height:38px;display:inline-flex;align-items:center;gap:5px}
  .mini:hover{border-color:var(--primary);color:var(--primary)}
  .mini svg{width:14px;height:14px}

  .metrics{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .metric{flex:1;min-width:64px;background:var(--bg);border-radius:10px;padding:8px 10px;text-align:center}
  .metric b{display:block;font-size:16px;color:var(--primary)}
  .metric span{font-size:11px;color:var(--ink2)}

  .empty{padding:40px 20px;text-align:center;color:var(--ink2)}
  .empty svg{width:46px;height:46px;opacity:.4;margin-bottom:8px}

  /* status badges (ideas) */
  .st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .st-0{background:#EFEFEF;color:#888}      /* 灵感 */
  .st-1{background:#E7EEFB;color:#4a6fc4}   /* 选题中 */
  .st-2{background:var(--accent-soft);color:var(--orange)} /* 已排期 */
  .st-3{background:var(--green-soft);color:var(--green)}   /* 已发布 */

  /* charts */
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
  .chart-card h3{margin:0 0 10px;font-size:14px;font-weight:700}
  .chart-card.full{grid-column:1 / -1}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12px;color:var(--ink2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(46,42,54,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:slide .22s ease}
  @keyframes slide{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .modal h3{margin:0 0 14px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink)}
  .field input,.field textarea,.field select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)
  }
  .field textarea{resize:vertical;min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .checks{display:flex;flex-wrap:wrap;gap:7px}
  .check{display:inline-flex;align-items:center;gap:5px;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:7px 11px;cursor:pointer;min-height:38px}
  .check input{width:16px;height:16px;accent-color:var(--primary)}
  .check.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .modal-actions{display:flex;gap:10px;margin-top:8px;position:sticky;bottom:0;background:#fff;padding-top:10px}
  .modal-actions .btn{flex:1;justify-content:center}
  .warn-box{background:var(--red-soft);border:1px solid #f3c9c9;color:#b23b3b;border-radius:11px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
  .warn-box.show{display:block}
  .warn-box b{color:var(--red)}

  /* dedup panel */
  .dedup-panel{background:var(--accent-soft);border:1px solid #f0d9c2;border-radius:14px;padding:12px;margin-bottom:12px;display:none}
  .dedup-panel.show{display:block}
  .dedup-panel input{width:100%;padding:10px 12px;border:1px solid #e6c9a8;border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
  .dedup-result{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .dup{border-left:3px solid var(--red);background:#fff;border-radius:8px;padding:9px 11px}
  .dup .d-title{font-size:14px;font-weight:600}
  .dup .d-date{font-size:12px;color:var(--red);font-weight:700;margin-top:2px}
  .dup .d-sub{font-size:12px;color:var(--ink2);margin-top:2px}

  .banner{background:var(--accent-soft);color:var(--orange);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .banner svg{width:18px;height:18px;flex:0 0 auto}

  .float-add{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:40;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;box-shadow:0 6px 20px rgba(107,127,215,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .float-add svg{width:26px;height:26px}

  /* 热点选题 */
  .hot-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
  .hot-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hot-title-main{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
  .hot-tracks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .hot-track{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);background:#f3f5fb;border:1px solid #e2e6f2;border-radius:999px;padding:3px 9px;line-height:1.4}
  .hot-track b{color:var(--c);font-weight:700}
  .hot-track i{font-style:normal;opacity:.85}
  .hot-track{cursor:default;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease}
  .hot-track:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(40,50,90,.10)}
  .hot-track.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);font-weight:600;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 22%,transparent)}
  .metric-collapse{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
  .mc-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;background:#f7f8fc;font-size:13px;font-weight:600;user-select:none}
  .mc-head small{font-weight:400;color:var(--ink2);font-size:11.5px;margin-left:2px}
  .mc-arrow{transition:transform .15s ease;color:var(--ink2);font-size:12px}
  .mc-head.open .mc-arrow{transform:rotate(90deg)}
  .mc-body{padding:10px 12px}
  .chip-wait{background:#fff3e0;color:#b26a00;border-color:#ffe1b0}
  .src-prev{font-size:12.5px;color:var(--ink);background:#f4f1fb;border:1px solid #e4def4;border-left:3px solid var(--primary);border-radius:8px;padding:8px 10px;margin:2px 0 4px;line-height:1.55;word-break:break-word}
  .src-prev b{color:#5b3fa3;font-weight:600}
  .chip-origin{background:#f1edfb;color:#6a4fb0;border-color:#e2d8f3}
  .metric-wait{font-size:12px;color:var(--ink2);padding:8px 0 2px}
  .hot-focus-intro{font-size:12.5px;color:var(--ink);background:var(--primary-soft);border:1px solid #dfe3f5;border-radius:10px;padding:7px 10px;margin:0 0 8px;line-height:1.5}
  .hot-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .hot-card{flex:0 0 auto;width:230px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  /* 实时热榜（点一下就拉 · 各平台热搜/热门话题） */
  .live-hot{background:#fff;border:1px solid #ffd9d9;border-radius:12px;padding:10px 11px;margin:8px 0 4px;box-shadow:0 1px 4px rgba(220,40,40,.06)}
  .live-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .hot-plat{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:#7a8194;background:#f4f5f9;border:1px solid #e4e7f0;border-radius:20px;padding:4px 11px;transition:.15s}
  .hot-plat i{font-style:normal;font-size:10px;font-weight:700;color:#b23;background:#ffe9ef;border-radius:8px;padding:0 5px}
  .hot-plat:hover{border-color:#ffb3b3}
  .hot-plat.on{color:#fff;background:var(--red);border-color:var(--red)}
  .hot-plat.on i{color:#fff;background:rgba(255,255,255,.28)}
  .live-board{max-height:340px;overflow-y:auto;padding-right:2px}
  .live-meta{font-size:11.5px;font-weight:700;color:#b23;margin-bottom:6px;letter-spacing:.2px}
  .live-row{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:8px;cursor:pointer;transition:.12s}
  .live-row:hover{background:#fff4f4}
  .live-rank{width:20px;height:20px;flex:0 0 20px;border-radius:6px;background:#ffe1e1;color:#c0392b;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .live-t{flex:1;font-size:13.5px;color:#2b2740;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live-heat{font-size:11px;font-weight:700;color:#e07b39;flex:0 0 auto}
  .live-act{flex:0 0 auto;font-size:11px;font-weight:700;color:#3a6ec0;background:#eef3fc;border-radius:8px;padding:2px 8px;opacity:0;transition:.12s}
  .live-row:hover .live-act{opacity:1}
  .proxy-help{margin-top:8px;font-size:12px;color:var(--ink2);line-height:1.7}
  .proxy-help code{background:#f2f3f7;border:1px solid #e3e6ee;border-radius:5px;padding:1px 5px;font-size:11.5px;color:#b23}
  /* 选题灵感生成器 */
  .inspire-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:6px}
  .in-card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 1px 3px rgba(20,30,60,.04)}
  .in-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .in-heat{flex:0 0 auto;font-size:11px;font-weight:800;color:#fff;background:#e2557b;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .in-topic{flex:1 1 auto;font-size:14.5px;font-weight:800;color:#1f2430;line-height:1.35;word-break:break-word}
  .in-meta{font-size:11.5px;color:#8b91a3;margin:5px 0 2px}
  .in-padv{font-size:12.5px;color:#4a5163;line-height:1.5;background:#f6f7fb;border-radius:9px;padding:7px 9px;margin:4px 0 8px}
  .in-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .in-col{border:1px solid var(--line);border-left:3px solid var(--c,#ccc);border-radius:9px;padding:7px 8px;background:#fcfcfe}
  .in-col-head{font-size:12px;font-weight:800;color:var(--c,#555);margin-bottom:3px}
  .in-col-op{font-size:12px;color:#3a4151;line-height:1.45;min-height:34px}
  .in-col .mini{margin-top:5px;padding:3px 9px;font-size:11.5px}
  .live-tabs-wrap{margin:4px 0 10px}
  .raw-hot{border:1px dashed #e2c9c9;border-radius:12px;padding:8px 11px;margin-top:10px;background:#fffaf9}
  .raw-hot>summary{cursor:pointer;font-size:13px;font-weight:700;color:#a35050;outline:none}
  .five-empty{background:#fff;border:1px dashed #e2c9c9;border-radius:12px;padding:16px;color:var(--ink2);font-size:13px;line-height:1.7;text-align:center}
  .five-col{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0 4px}
  .fc-card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
  .fc-head{display:flex;flex-direction:column;gap:1px}
  .fc-head b{font-size:13.5px;font-weight:800;color:var(--c)}
  .fc-head span{font-size:11px;color:var(--ink2)}
  .fc-body{display:flex;flex-direction:column;gap:8px;flex:1}
  .fc-item{background:#fafbff;border:1px solid #eef0f6;border-radius:9px;padding:7px 8px}
  .fc-title{font-size:13px;font-weight:700;line-height:1.4;color:#2b2740}
  .fc-from{font-size:11px;color:#a35050;margin-top:3px}
  .fc-angle{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
  .fc-empty{font-size:12px;color:var(--ink2);opacity:.8}
  .fc-refresh{font-size:11.5px;padding:4px 8px;align-self:flex-start}
  @media(max-width:920px){ .five-col{grid-template-columns:repeat(2,1fr)} }
  /* 五栏选题灵感（热榜不展示，仅输出各栏目选题与灵感） */
  .col-block{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:10px;box-shadow:var(--shadow)}
  .col-block-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:9px;border-bottom:2px solid var(--c);flex-wrap:wrap}
  .col-block-name{font-size:14px;font-weight:800;color:var(--c)}
  .col-block-desc{font-size:11.5px;color:var(--ink2);flex:1 1 auto}
  .col-block-count{font-size:11px;font-weight:700;color:#fff;background:var(--c);border-radius:20px;padding:1px 9px}
  .col-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
  .col-topic{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .col-topic-head{display:flex;align-items:flex-start;gap:7px;justify-content:space-between}
  .col-topic-title{font-size:13.5px;font-weight:800;color:#1f2430;line-height:1.4;word-break:break-word}
  .col-topic-pts{display:flex;flex-direction:column;gap:4px}
  .col-pt{font-size:12px;color:#3a4151;line-height:1.5;background:#f7f8fc;border-radius:8px;padding:5px 8px;border-left:2px solid var(--c)}
  .col-topic-line{font-size:13px;color:#2a3140;line-height:1.6;background:#f7f8fc;border-radius:8px;padding:7px 9px;border-left:3px solid var(--c)}
  .col-topic-meta{font-size:12px;color:#5a6172;font-weight:700}
  .col-empty{font-size:12px;color:var(--ink2);opacity:.8;padding:4px 0}
  .col-topic .mini{align-self:flex-start;margin-top:1px}
  .hot-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .hot-live{font-size:10px;font-weight:700;color:#fff;background:var(--red);border-radius:10px;padding:2px 7px}
  .hot-ref{font-size:10px;font-weight:700;color:#7a8194;background:#eef0f5;border:1px solid #dfe3ee;border-radius:10px;padding:2px 7px}
  .hot-title{font-size:14px;font-weight:700;line-height:1.35}
  .hot-angle{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.5}
  /* 三栏结构化选题卡片 */
  .topic-struct{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
  .topic-struct .t-name{font-size:15px;font-weight:800;color:#2b2740}
  .topic-struct .t-sub{font-size:12px;font-weight:600;color:var(--ink2)}
  .topic-struct .t-type{font-size:11px;font-weight:700;color:#fff;background:#D99A5B;border-radius:6px;padding:1px 6px;white-space:nowrap}
  .topic-struct .t-line{flex:1 0 100%;font-size:13.5px;font-weight:600;line-height:1.5;color:#3a3550;margin-top:4px}
  .topic-struct .t-role{flex:1 0 100%;font-size:12px;color:var(--ink2);margin-top:2px}
  .hot-hit{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#fff0e6;color:#b5532e;font-size:11px;font-weight:600;vertical-align:middle}
  /* 发布节奏 */
  .rhythm-card{background:linear-gradient(135deg,#EEF1FB,#F4EEFB);border:1px solid #dfe3f5;border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
  .rhythm-head{font-size:14px;font-weight:700;margin-bottom:8px}
  .rhythm-row{font-size:13px;color:var(--ink)}
  .rhythm-row b{font-size:14px}
  .rhythm-dots{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center}
  /* toast */
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(46,42,54,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:opacity .2s;opacity:0;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}

  /* mobile bottom tab */
  @media(max-width:768px){
    .tabbar{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:35;
      border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.06);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
    .wrap{padding-bottom:84px}
    .brand p{display:none}
    .chart-grid{grid-template-columns:1fr}
  }
  @media(min-width:769px){
    .float-add{bottom:24px}
  }
  /* ===== 云同步弹窗 ===== */
  .cloud-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:12px;background:var(--primary-soft)}
  .cloud-toggle span{font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
  .slider{position:absolute;inset:0;background:#c6ccdf;border-radius:30px;transition:.2s}
  .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--primary)}
  .switch input:checked + .slider:before{transform:translateX(20px)}
  .cloud-actions{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
  .cloud-actions .btn{flex:1;min-width:84px;justify-content:center}
  .cloud-status{font-size:13px;padding:9px 12px;border-radius:10px;margin-bottom:10px;background:#f1f3fb;color:var(--ink2)}
  .cloud-status.ok{background:#e7f6ee;color:#1f7a4d}
  .cloud-status.err{background:var(--red-soft);color:#b23b3b}
  .cloud-status.warn{background:#fff4e0;color:#9a6b00}
  .cloud-help{font-size:12px;line-height:1.7;color:var(--ink2);background:#f7f8fc;border:1px dashed var(--line);border-radius:11px;padding:10px 12px}
  .cloud-help code{background:#eceefb;padding:1px 5px;border-radius:5px;color:var(--primary);font-size:11px}
  .cloud-help b{color:var(--ink)}
  .cloud-divider{height:1px;background:var(--line);margin:14px 0 12px;opacity:.7}

/* 批量导入各平台作品 */
.imp-map{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.imp-map-title,.imp-prev-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
.imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:12px}
.imp-row{display:flex;align-items:center;gap:8px;font-size:13px}
.imp-label{flex:0 0 84px;color:var(--ink2)}
.imp-sel{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;max-width:100%}
.imp-prev{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.imp-prev-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px;flex-wrap:wrap}
.imp-prev-row.dup{border-color:var(--red);background:var(--red-soft)}
.imp-dup-flag{margin-left:auto;color:var(--red);font-size:12px;font-weight:600}
@media(max-width:600px){.imp-grid{grid-template-columns:1fr}.imp-label{flex:0 0 72px}}

/* ===== 作品数据看板 ===== */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.kpi b{display:block;font-size:17px;color:var(--primary);font-weight:800;line-height:1.25}
.kpi span{font-size:11.5px;color:var(--ink2)}
.kpi.hot b{color:var(--red)}
.strat-tip{background:linear-gradient(135deg,#EEF4FF,#F4EEFB);border:1px solid #dde4f7;border-radius:14px;padding:13px 16px;margin-bottom:14px;line-height:1.75;font-size:13.5px;color:var(--ink)}
.strat-tip b{color:var(--primary)}
.bar-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.bar-label{flex:0 0 70px;font-size:13px;color:var(--ink)}
.bar-track{flex:1;height:13px;background:#f0eef8;border-radius:8px;overflow:hidden;min-width:40px}
.bar-fill{height:100%;border-radius:8px}
.bar-val{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--ink);min-width:46px;text-align:right}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:4px}
.heat-cell{border-radius:10px;padding:10px 2px;text-align:center;font-size:11px;color:#fff;min-height:52px;display:flex;flex-direction:column;justify-content:center}
.heat-cell span{display:block;font-size:15px;font-weight:800;margin-bottom:1px;line-height:1.1}
.heat-cell small{opacity:.9}
@media(max-width:768px){.kpi-row{grid-template-columns:repeat(3,1fr)}.bar-label{flex:0 0 56px;font-size:12px}.heat-cell{padding:8px 1px;min-height:46px}}
/* 实时热门标签建议 */
.tag-suggest-box{ border:1px dashed var(--line); border-radius:12px; padding:10px 12px; margin-top:4px; background:linear-gradient(180deg,#ffffff,#fafbff); }
.tsg-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.tsg-head>span{ font-size:13px; font-weight:700; color:var(--ink); }
.tsg-note{ font-size:11px; color:var(--ink2); margin:4px 0 8px; line-height:1.5; }
.tsg-tags{ display:flex; flex-wrap:wrap; gap:6px; }
.tsg-tag{ cursor:pointer; user-select:none; font-size:12px; padding:5px 10px; border-radius:999px; background:#eef1fb; color:#3a4a8a; border:1px solid transparent; transition:.15s; }
.tsg-tag:hover{ background:#e2e7fb; }
.tsg-tag.live{ background:#fff1e6; color:#c0531b; border-color:#ffd9b8; }
.tsg-tag.used{ background:#e8f6ee; color:#2f8a55; border-color:#bfe6cd; }
.tsg-empty{ font-size:12px; color:var(--ink2); }
.tsg-tag.self{ background:#eaf1ff; color:#3a4a8a; border-color:#c9d6f5; }
.tsg-tag.hit{ background:#fff0e6; color:#b5532e; border-color:#ffcf9e; font-weight:600; box-shadow:0 0 0 2px rgba(245,150,90,.14); }
.tsg-tag.ent{ background:#ede7fb; color:#5b3aa6; border-color:#cdbcf2; font-weight:600; box-shadow:0 0 0 2px rgba(140,90,220,.12); }

/* 全局刷新按钮旋转 */
#globalRefresh.spin svg{ animation: spin 0.9s linear infinite; }
@keyframes spin{ from{ transform:rotate(0); } to{ transform:rotate(360deg); } }
#globalRefresh:disabled{ opacity:.6; cursor:default; }

  /* 平台切换 Tab（数据看板） */
  .plat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .plat-tab{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
  .plat-tab small{font-size:11px;color:var(--ink2);background:#f4f0ea;border-radius:10px;padding:1px 6px}
  .plat-tab:hover{border-color:var(--primary)}
  .plat-tab.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .plat-tab.on small{background:rgba(255,255,255,.25);color:#fff}
  /* 各平台数据录入卡 */
  .plat-metric-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fcfbf9}
  .pmc-head{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pmc-copy{font-size:11px;padding:3px 8px;line-height:1.2;border:none;background:#F0ECFA;color:#7a5fc7;border-radius:8px;cursor:pointer}
  .pmc-copy:hover{background:#e6def7}
  .cov-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
  .cov-row:last-child{border-bottom:none}
  .cov-name{flex:1;min-width:120px;font-size:13px;color:var(--ink);font-weight:600}
  .cov-miss{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
#bootScreen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#eaf2ff,#f7f9ff);color:#3a4a66}
.boot-spin{width:42px;height:42px;border:4px solid #d3e0f5;border-top-color:#5b8def;border-radius:50%;animation:bootspin .8s linear infinite;margin-bottom:14px}
@keyframes bootspin{to{transform:rotate(360deg)}}
.boot-tip{font-size:14px;letter-spacing:.5px}
#bootError{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;padding:24px}
#bootError .box{max-width:520px;border:1px solid #f0c2c2;background:#fff5f5;border-radius:12px;padding:20px 22px;color:#a33}
#bootError h3{margin:0 0 8px;font-size:16px}
#bootError pre{white-space:pre-wrap;font-size:12px;color:#855;max-height:200px;overflow:auto;margin:10px 0}
/* ===== 内容日历 ===== */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
@media(max-width:768px){.cal-wrap{grid-template-columns:1fr}}
#calendarBox,#calDetail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cal-head .cal-title{flex:1;text-align:center;font-size:18px;font-weight:700;letter-spacing:.5px;color:var(--ink)}
.cal-head-right{display:flex;align-items:center;gap:6px}
.cal-head .btn-soft{min-width:38px;height:38px;padding:0;justify-content:center;font-size:18px;line-height:1;border-radius:10px}
.cal-grid-h{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow{text-align:center;font-size:12px;font-weight:600;color:var(--ink2);padding:4px 0}
.cal-dow.we{color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{position:relative;min-height:76px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.15s;overflow:hidden}
.cal-cell:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px)}
.cal-cell.empty{background:transparent;border:none;box-shadow:none;cursor:default}
.cal-cell.empty:hover{transform:none}
.cal-d{font-size:15px;font-weight:600;color:var(--ink);line-height:1}
.cal-cell.today{border-color:var(--accent);background:var(--accent-soft)}
.cal-cell.today .cal-d::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.cal-cell.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 2px var(--primary) inset}
.cal-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.cal-b{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:8px;line-height:1.5;white-space:nowrap}
.cal-b.pub{background:var(--primary-soft);color:var(--primary)}
.cal-b.plan{background:var(--accent-soft);color:var(--orange)}
.cal-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink2)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend .cal-b{padding:1px 4px}
/* 日历格子内直接展示已发布主题（免点开） */
.cal-pub{display:flex;flex-direction:column;gap:2px;margin-top:2px;min-width:0;overflow:hidden}
.cal-pt{display:flex;align-items:center;gap:4px;min-width:0;max-width:100%;font-size:11px;line-height:1.3;color:var(--primary);font-weight:600}
.cal-pt .cal-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
.cal-pt::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--primary);flex:0 0 auto}
.cal-col{flex:0 0 auto;font-size:9px;font-weight:800;line-height:1.5;padding:0 4px;border-radius:5px;color:#fff;background:var(--cc);white-space:nowrap;letter-spacing:.2px}
.cal-pmore{font-size:10px;line-height:1.3;color:var(--ink2);font-weight:600}
/* 日历格子内直接展示待发布主题（免点开），橙色空心圈标记，与已发布实心点区分 */
.cal-plan{display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cal-pt.plan{color:var(--orange);font-weight:600}
.cal-pt.plan::before{background:transparent;border:1.5px solid var(--orange);box-sizing:border-box}
/* 详情面板 */
#calDetail{position:sticky;top:84px}
.cal-detail-empty{color:var(--ink2);font-size:13px;text-align:center;padding:28px 8px;line-height:1.7}
.cal-detail-day{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--ink)}
.cal-sec{font-size:13px;font-weight:700;margin:14px 0 8px;color:var(--ink)}
.cal-sec:first-of-type{margin-top:0}
.cal-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.cal-item .ci-main{flex:1;min-width:0}
.cal-item .ci-title{font-size:14px;font-weight:600;color:var(--ink);word-break:break-word;line-height:1.4}
.cal-item .ci-sub{font-size:12px;color:var(--ink2);margin-top:3px}
.tab-badge{display:none;min-width:18px;height:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;line-height:1}
/* 日历详情快捷操作 */
.cal-detail-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cal-detail-acts .mini{flex:1;min-width:120px;justify-content:center}
.cal-jump{display:flex;gap:8px;margin-top:10px}
.cal-jump .mini{flex:1;justify-content:center}
.empty-cell-add{display:flex;gap:8px;margin-top:10px}
.empty-cell-add .mini{flex:1;justify-content:center}
</style>

<body>

<div id="bootScreen"><div class="boot-spin"></div><div class="boot-tip">晚风予言 · 正在加载工作台…</div></div>

<header class="app">
  <div class="wrap head-row">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h2l2-9 3 6 2-4 2 3h7"/><path d="M3 21h18"/></svg>
      </div>
      <div style="min-width:0">
        <h1>晚风予言 · 创作工作台</h1>
        <p>晚风捎来心动、释然与成长，也捎来平凡日子里的细碎光亮</p>
        <div id="saveState" class="save-state"></div>
      </div>
    </div>
    <div class="head-actions">
      <button class="btn btn-ghost" onclick="exportJSON()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>导出
      </button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M4 3h16"/></svg>导入
      </button>
      <button class="btn btn-ghost" onclick="exportLocal()" title="下载单文件离线版，双击即可使用（含当前数据），不再依赖在线链接">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>本地版
      </button>
      <button class="btn btn-ghost" onclick="openCloudModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 1 1 .9-7.9A5 5 0 0 1 18 9.5a3.5 3.5 0 0 1 .5 6.9"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/></svg>云同步
      </button>
      <button class="btn btn-ghost" id="globalRefresh" onclick="refreshAllLive(false)" title="实时拉取全平台热点与热门标签">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>刷新实时
      </button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
</header>

<div class="wrap">

  <!-- 今天要处理 -->
  <section class="today" id="todaySection">
    <div class="today-card" id="todayCard">
      <div class="today-head">
        <span class="dot"></span>
        <h2>今天要处理</h2>
        <span class="count" id="todayCount"></span>
        <span class="toggle" onclick="toggleToday()">收起</span>
      </div>
      <div class="today-list" id="todayList"></div>
    </div>
  </section>

  <!-- tabbar -->

function parseGeneric(d){

          if(typeof t==='string'&&t.length>=2&&t.length<=30&&!/https?:|www\.|\/|\{|\}|\[|\]/.test(t)){

function extractHotWords(text, plat){
  if(!text||typeof text!=='string') return [];
  const items=[]; const seen=new Set();
  const lines=text.split(/\r?\n/);
  for(const raw of lines){
    const line=raw.replace(/^[\s#>\-\*\d\.\[\]\(\)\|"`'·]+/,'').trim();
    if(!line||line.length<2||line.length>30) continue;
    if(/https?:|www\.|\.json|undefined|null|error|errno|code":|"message"/i.test(line)) continue;
    if(!/[一-龥]/.test(line)) continue;                       // 必须含中文，排除纯英文/乱码
    const key=line.slice(0,16);
    if(!seen.has(key)){ seen.add(key); items.push({t:line,plat:plat||'热榜'}); }
    if(items.length>=30) break;
  }

}

const CORS_PROXIES=[
  u=>u,                                                                           // 直连（部分接口自带 CORS，如 pearktrue）
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),                 // 全球通用
  u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),           // 稳定、带 CORS
  u=>'https://cors.eu.org/'+u,                                                    // 前缀代理
];
async function fetchVia(url, opts){
  const textExtract=(opts&&opts.textExtract)||null;
  const proxies=(opts&&opts.proxies)||CORS_PROXIES;
  let lastErr;
  for(const wrap of proxies){
    const target=wrap(url);
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),5000);
      const r=await fetch(target,{signal:ctrl.signal,mode:'cors'});
      if(to)clearTimeout(to);
      if(!r.ok) throw new Error('HTTP '+r.status);
      let d;
      try{ d=await r.json(); }
      catch(e){
        /* JSON 解析失败 → 尝试把响应文本当作平台热榜页内容提取（Agent Reach 同款） */
        const txt=await r.text();
        if(typeof textExtract==='function'){ const ex=textExtract(txt); if(ex&&ex.length) return ex; }
        throw new Error('非 JSON 且无可提取文本');
      }
      return d;
    }catch(e){ lastErr=e; console.warn('[live] 通道失败', target.slice(0,64), e&&e.message); }
  }
  throw lastErr||new Error('所有通道失败');
}

const BODY_KNOWN=new Set([...SELF_TAG_DICT, ...CONTENT_VOCAB]);
function extractBodyTags(text){
  const blob=(text||'');
  if(blob.length<2) return [];
  const out=[]; const seen=new Set();
  const hit=w=>{ if(w && BODY_KNOWN.has(w) && !seen.has(w)){ seen.add(w); out.push(w); } };
  // 长词优先扫描：先 4/3 字再 2 字，滑动窗口（i+L 为结束下标），避免短词截断重复计入
  for(const L of [4,3,2]){
    for(let i=0;i+L<=blob.length;i++){ const g=blob.slice(i,i+L); if(g) hit(g); }
  }
  // 单字词库成员（如 猫/海/雨/花/雪）逐字命中，避免被 2~4 字窗口漏掉
  for(const ch of blob){ if(ch && BODY_KNOWN.has(ch) && !seen.has(ch)){ seen.add(ch); out.push(ch); } }
  return out;
}

// 反向索引：人名 → 作品/剧目，用于「相邻作者/歌手」模式补全
const PERSON_INDEX={}; // name → {type:'author'|'singer'|'actor', works:[...]}
Object.entries(POEM_KB).forEach(([w,a])=>{ if(!a) return; (PERSON_INDEX[a]=PERSON_INDEX[a]||{author:[],singer:[],actor:[]}).author.push(w); });
Object.entries(SONG_KB).forEach(([w,s])=>{ if(!s) return; (PERSON_INDEX[s]=PERSON_INDEX[s]||{author:[],singer:[],actor:[]}).singer.push(w); });
Object.entries(DRAMA_KB).forEach(([d,v])=>{ (v.actor||[]).forEach(a=>{ (PERSON_INDEX[a]=PERSON_INDEX[a]||{author:[],singer:[],actor:[]}).actor.push(d); }); });
function extractEntities(title, text, colKey){
  const blob=(title||'')+' '+(text||'');
  const out=[]; const seen=new Set();
  const add=t=>{ t=(t||'').trim().replace(/[《》]/g,''); if(t && t.length>=2 && t.length<=14 && !seen.has(t)){ seen.add(t); out.push(t); } };
  // 辅助：非中文边界的位置安全匹配，避免把短作品名误吞进别的词
  const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const findOccur=(str,w)=>{
    const re=new RegExp('(^|[^一-龥])'+escRe(w)+'($|[^一-龥])','g'); const r=[]; let m;
    while((m=re.exec(str))!==null){ const s=m.index+(m[1]?m[1].length:0); r.push({start:s,end:s+w.length}); }
    return r;
  };
  const nearby=(aPos,bStr,win=12)=>{
    let idx=blob.indexOf(bStr);
    while(idx!==-1){ if(Math.abs(idx-aPos)<=win) return true; idx=blob.indexOf(bStr,idx+1); }
    return false;
  };
  const poetryCtx = colKey==='诗笺' || /诗|词|古文|名句|出处|古风/.test(blob);

  // 1) 书名号《》析出（最可靠）
  const book=[...blob.matchAll(/《([^《》]{1,15})》/g)].map(m=>({w:m[1].trim(), s:m.index, e:m.index+m[0].length})).filter(x=>x.w);
  book.forEach(({w})=>{
    add(w);
    if(POEM_KB[w]){ const a=POEM_KB[w]; add(a); add(w+'·'+a); }
    if(SONG_KB[w]){ const s=SONG_KB[w]; if(s){ add(s); add(w+'—'+s); } }
    const d=DRAMA_KB[w];
    if(d){
      (d.role||[]).forEach(r=>{ if(blob.indexOf(r)!==-1) add(r); });
      (d.actor||[]).forEach(a=>{ if(blob.indexOf(a)!==-1) add(a); });
      add(w);
    }
  });
  const occupied=book.map(x=>({start:x.s,end:x.e}));
  const free=(s,e)=>!occupied.some(r=>s<r.end && e>r.start);
  const use=(s,e)=>{ if(free(s,e)) occupied.push({start:s,end:e}); return free(s,e); };

  // 2) 名句反查：标题或正文出现完整名句 → 作品 → 作者
  Object.entries(POEM_LINE_KB).forEach(([line,work])=>{
    const author=POEM_KB[work];
    if(blob.indexOf(line)!==-1){
      if(author){ add(work); add(author); add(work+'·'+author); }
      else add(work);
    }
  });

  // 3) 无书名号时扫描已知作品名：按长度降序优先匹配长名，短名需上下文/作者佐证
  const allWorks=[
    ...Object.keys(POEM_KB).map(w=>({w,t:'poem'})),
    ...Object.keys(SONG_KB).map(w=>({w,t:'song'})),
    ...Object.keys(DRAMA_KB).map(w=>({w,t:'drama'}))
  ].sort((a,b)=>b.w.length-a.w.length);
  allWorks.forEach(({w,t})=>{
    findOccur(blob,w).forEach(({start,end})=>{
      if(!free(start,end)) return;
      const inTitle=(title||'').indexOf(w)!==-1;
      if(t==='poem'){
        const author=POEM_KB[w];
        const hasAuthor=author && blob.indexOf(author)!==-1 && nearby(start,author,12);
        const keep = w.length>=3 || inTitle || hasAuthor || poetryCtx;
        if(keep){
          use(start,end); add(w);
          if(author && (hasAuthor || inTitle || poetryCtx)){ add(author); add(w+'·'+author); }
        }
      }else if(t==='song'){
        const singer=SONG_KB[w];
        const hasSinger=singer && blob.indexOf(singer)!==-1 && nearby(start,singer,12);
        const keep = w.length>=3 || inTitle || hasSinger;
        if(keep){
          use(start,end); add(w);
          if(singer && hasSinger){ add(singer); add(w+'—'+singer); }
        }
      }else if(t==='drama'){
        const d=DRAMA_KB[w];
        const hits=[...(d.actor||[]), ...(d.role||[])].filter(p=> blob.indexOf(p)!==-1 && nearby(start,p,12) );
        const keep = w.length>=3 || inTitle || hits.length>0;
        if(keep){
          use(start,end); add(w);
          hits.forEach(p=>{ add(p); add(p+'·'+w); });
        }
      }
    });
  });

  // 4) 相邻作者/歌手模式：「X《作品》」或「《作品》X」或「X的《作品》」(X=2~4字人名)
  const adj=[...blob.matchAll(/([一-龥]{1,4})(?:的)?《([^《》]{1,15})》/g)].map(m=>[m[1].trim(),m[2].trim()])
    .concat([...blob.matchAll(/《([^《》]{1,15})》([一-龥]{1,4})/g)].map(m=>[m[2].trim(),m[1].trim()]));
  adj.forEach(([person,w])=>{
    if(!person || !w || seen.has(person)) return;
    const idx=PERSON_INDEX[person];
    if(idx){
      add(person);
      if(idx.author.length && POEM_KB[w]) add(w+'·'+person);
      if(idx.singer.length && SONG_KB[w]) add(w+'—'+person);
      if(idx.actor.length) add(w); // 演员对应剧名已在书名号处理
    }
  });

  // 5) 显式复合：「歌名—歌手」或「歌名 - 歌手」（不依赖《》）
  [...blob.matchAll(/([一-龥A-Za-z0-9]{1,10})\s*[—\-–]\s*([一-龥A-Za-z0-9]{1,8})/g)].forEach(m=>{
    const a=m[1].trim(), b=m[2].trim(); if(!a||!b) return;
    if(SONG_KB[a] && SONG_KB[a]===b){ add(a); add(b); add(a+'—'+b); }       // 歌名—歌手 完全命中
    else if(SONG_KB[b] && SONG_KB[b]===a){ add(a); add(b); add(b+'—'+a); }  // 歌手—歌名
    else if(SONG_KB[a]){ add(a); add(b); add(a+'—'+b); }                    // 歌名—歌手 歌手未知也推组合
    else if(SONG_KB[b]){ add(a); add(b); add(b+'—'+a); }
  });

  // 6) 无书名号兜底：识别「出处：作品 作者」「(出处：作品 作者)」「作品 作者」等
  const clean=blob.replace(/[《》]/g,'');
  [...clean.matchAll(/(?:出处[：:]?\s*)?([一-龥A-Za-z0-9]{2,10})\s+([一-龥]{2,4})/g)].forEach(m=>{
    const a=m[1].trim(), b=m[2].trim();
    if(POEM_KB[a] && POEM_KB[a]===b){ add(a); add(b); add(a+'·'+b); }
    if(SONG_KB[a] && SONG_KB[a]===b){ add(a); add(b); add(a+'—'+b); }
    if(POEM_KB[b] && POEM_KB[b]===a){ add(b); add(a); add(b+'·'+a); }
    if(SONG_KB[b] && SONG_KB[b]===a){ add(b); add(a); add(b+'—'+a); }
  });

  return out;
}
/* 文案 → 实时热门标签（self）：每次保存文案重算「我的主题」；命中实时热点标记 hitLive，形成闭环 */
function syncTagPoolFromSelf(title, text, col, manualTags, now){
  if(!now) now=Date.now();
  const tags=extractSelfTags(title, text, col);
  const norm=s=>(s||'').replace(/[<>&"'，。、！？!?；;：:"'（）()【】\[\]·\s\n\r]/g,'').trim();
  (manualTags||[]).forEach(t=>{ const nt=norm(t).slice(0,12); if(nt.length>=2) tags.push(nt); });
  if(!tags.length) return;
  const liveSet=new Set((state.tagPool||[]).filter(x=>x.live).map(x=>x.tag));
  const gen=tags.map(t=>({col:col||guessCol(t), tag:t, self:true, live:false, hitLive:liveSet.has(t), fetchedAt:now}));
  const keep=(state.tagPool||[]).filter(x=>!x.self);             // 我的主题每次重算，不无限堆积
  gen.forEach(x=>{ const k='|'+x.col+'|'+x.tag; const ex=keep.find(z=>('|'+z.col+'|'+z.tag)===k);
    if(ex){ ex.self=true; ex.hitLive=true; if(!ex.fetchedAt) ex.fetchedAt=now; } // 命中实时热点：合并 self 维度并点亮
    else { keep.push(x); } });
  state.tagPool=keep.slice(-200);
  state.tagUpdated=now;
}
/* 实时热点刷新后，重算「我的文案主题」与实时热点的命中关系 */
function recomputeSelfHit(){
  const liveSet=new Set((state.tagPool||[]).filter(x=>x.live).map(x=>x.tag));
  (state.tagPool||[]).forEach(x=>{ if(x.self) x.hitLive=liveSet.has(x.tag); });
}

  }
}

function hotHitsMyTags(h){
  const mine=(state.tagPool||[]).filter(x=>x.self).map(x=>x.tag);

  return mine.some(tag=> tag.length>=2 && t.indexOf(tag)!==-1 );
}

function jsAttr(s){

/* ===== 记录 id 的安全传递 =====

function encId(s){
  return encodeURIComponent(String(s==null?'':s)).replace(/[!'()*.~]/g, c=>'%'+c.charCodeAt(0).toString(16).toUpperCase());

function decId(s){ try{ return decodeURIComponent(String(s==null?'':s)); }catch(e){ return String(s==null?'':s); } }

  if(typeof fn!=='function'){ try{ flashToast('操作不可用，请刷新页面'); }catch(e){} return; }
  try{ fn(decId(token)); }catch(err){ try{ flashToast('操作失败：'+(err&&err.message||'未知错误')); }catch(e){} }
}

    d = window.__INITIAL__.state;

/* 导出单文件离线版：把当前数据与完整 HTML 一起下载，双击即用，彻底不依赖在线链接 */
function exportLocal(){
  try{
    const data = { state: state };
    const inject = '<'+'script>window.__INITIAL__=' + JSON.stringify(data).replace(/<\/script>/g,'<\\/script>') + ';<\/'+'script>';
    let html = document.documentElement.outerHTML;
    if(html.indexOf('</head>')>=0) html = html.replace('</head>', inject + '\n</head>');
    else html = inject + html;
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a');
    const d = new Date().toISOString().slice(0,10);
    a.href = URL.createObjectURL(blob);
    a.download = '晚风予言创作台_离线版_'+d+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} }, 4000);
    flashToast('已下载离线版 · 双击即可使用（含当前数据，无需联网）');
  }catch(e){ try{ flashToast('下载离线版失败：'+(e&&e.message||e)); }catch(_){ alert('下载失败：'+(e&&e.message||e)); } }
}

/* 防重：相似度检测 */
function findSimilar(inputTitle, inputTags, excludeId){
  const title=(inputTitle||'').trim().toLowerCase();
  const tags=(inputTags||[]).map(t=>t.toLowerCase());
  return state.works.filter(w=>{
    if(w.id===excludeId) return false;
    const wt=(w.title||'').toLowerCase();
    const wtags=(w.tags||[]).map(t=>t.toLowerCase());
    if(title && wt && (wt.includes(title) || title.includes(wt)) && title.length>=2) return true;
    if(tags.length && wtags.some(t=>tags.includes(t))) return true;
    return false;
  });
}

  ).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  留声:['歌词','歌单','单曲循环','演唱会','旋律','翻唱','现场','BGM'],
};
/* 基于栏目赛道词库打分归类：命中赛道关键词越多越匹配；强指示词额外加权；无命中回退「碎语」（通用） */
function classifyCol(text){
  const t=text||'';
  let best='碎语', bestScore=0;
  Object.keys(COL_TRACKS).forEach(col=>{
    let s=0; COL_TRACKS[col].kw.forEach(k=>{ if(t.indexOf(k)!==-1) s += (k.length>=3?2:1); });
    if(COL_STRONG[col] && COL_STRONG[col].some(k=>t.indexOf(k)!==-1)) s += 6;
    if(s>bestScore){ bestScore=s; best=col; }
  });
  return {col:best, score:bestScore};
}

/* ===== 实时热榜（点一下就拉 · 各平台热搜/热门话题，作选题灵感） =====
   浏览器直连各平台接口会被 CORS 挡死，故必须经「你掌控的代理」服务端抓取。
   代理契约： GET {base}/hot?plat=weibo  →  { plat, items:[{t,heat}], updatedAt }
   两种代理任选：① 本机 Node 代理 node scripts/proxy.mjs（零账号，http://localhost:8787）
               ② Cloudflare Worker（部署 worker/hot-proxy.js，手机也能用，填 Worker 地址）
   页面自动尝试：已配置 Worker URL → 本机 localhost:8787 → 否则提示配置。 */
const LIVE_PLATFORMS = [
  {key:'weibo', name:'微博', note:'热搜'},
  {key:'douyin', name:'抖音', note:'热点'},
  {key:'xhs', name:'小红书', note:'热帖'},
  {key:'zhihu', name:'知乎', note:'热榜'},
  {key:'bili', name:'B站', note:'热门'},
  {key:'shipinhao', name:'视频号', note:'热榜'},
  {key:'kuaishou', name:'快手', note:'热榜'}
];
function liveProxyBase(){
  try{ const u=localStorage.getItem('LIVE_PROXY_URL'); if(u && u.trim()) return u.trim().replace(/\/+$/,''); }catch(e){}
  return 'http://localhost:8787';
}
function platName(key){ const p=LIVE_PLATFORMS.find(x=>x.key===key); return p?p.name:key; }
async function fetchLiveHotViaProxy(plat){
  const base=liveProxyBase();
  const url=base+'/hot?plat='+encodeURIComponent(plat)+'&_='+Date.now();
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 8000);
  try{
    const r=await fetch(url,{signal:ctrl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    const items=Array.isArray(d.items)?d.items:(Array.isArray(d)?d:[]);
    return { plat:plat, items: items.map(it=>({t:String(it.t||it.title||'').replace(/\s+/g,' ').trim().slice(0,80), heat:Number(it.heat||it.hot||0)||0})).filter(x=>x.t.length>=2), updatedAt:d.updatedAt||Date.now() };
  } finally { clearTimeout(to); }
}
/* ===== 选题灵感引擎：拉实时热点 → 按高热度筛选 → 结合五栏创作方向生成创作意见 =====
   浏览器直连各平台接口会被 CORS 挡死，必须经「你掌控的代理」服务端抓取（proxy.mjs / CF Worker）。
   页面自动尝试：已配置 Worker URL → 本机 localhost:8787 → 否则提示配置。热榜本身不展示，仅作选题参考。 */
const INSPIRE_TABS = [...LIVE_PLATFORMS, {key:'all', name:'全网综合', note:'跨平台'}];
async function genInspiration(plat, cached, shuffle){
  plat='all'; state.activeHotPlat='all';   // 选题原料统一来自「全网综合」跨平台真实热门话题
  const btn=document.getElementById('inspireGen');
  if(btn){ btn.disabled=true; btn.textContent='生成中…'; }

    items = collectLiveItems();
  } else {

    if(items && items.length){
      state.liveHot = state.liveHot||{};
      state.liveHot.all = { items: items.map(x=>({t:x.t, heat:x.heat, src:x.src||'全网'})), updatedAt: Date.now() };
    } else {
      items = collectLiveItems();
      if(items && items.length) flashToast('代理未连接，已用作品库生成选题');
    }
  }
  if(!items || !items.length){
    // 联网完全不可用：留空，由 buildColumnTopics 用真实作品库填充（诗笺/映言/留声为真实数据，碎语/心事用常驻）
    items = [];
  }
  // 实时热歌榜（留声栏真实数据源）——与热榜并行获取
  let music = [];
  try{ music = await fetchLiveMusic(); }catch(e){ music = []; }
  if(!music || !music.length){ music = FALLBACK_SONGS.slice(); }
  const data = buildColumnTopics(items, music, shuffle);
  state.colTopics = data; save(); renderHotTopics();
  if(btn){ btn.disabled=false; btn.textContent='🔄 生成选题灵感'; }

async function fetchInspireTopics(plat){
  if(plat==='all'){
    const d = await fetchLiveHotViaProxy('all');
    return (d.items||[]).map(it=>({ t:it.t, heat:Number(it.heat)||0, src:it.src||'全网' }));
  }
  const d = await fetchLiveHotViaProxy(plat);
  return (d.items||[]).map(it=>({ t:it.t, heat:Number(it.heat)||0, src:platName(plat) }));

async function fetchLiveMusic(){
  const base = (function(){try{return (localStorage.getItem('LIVE_PROXY_URL')||'').trim();}catch(e){return '';}})() || 'http://localhost:8787';
  const url = base.replace(/\/+$/,'') + '/music';
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const r = await fetch(url, { signal: ctrl.signal });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    const arr = (d && d.items) || [];
    return arr.filter(x=>x && x.name).map(x=>({ name:x.name, singer:(x.singer||'').toString() })).slice(0,20);
  }catch(e){ return []; }
  finally{ clearTimeout(t); }
}
/* 把「实时全网热门话题」按栏目归类，转化为「五栏各自的选题与灵感」。
   核心原则（第一性原理）：
   1) 产品是「五栏选题库」，不是「热榜」。热榜只是不可见的燃料。
   2) 只有与某栏核心「真正相关」的话题才进入该栏；无关话题直接丢弃（不强行蹭）。
   3) 每个进入某栏的话题，被「转译」为该栏专属的选题标题 + 可执行的创作灵感（角度/金句/评论入口）。
   4) 某栏实时匹配不足时，用该栏常驻灵感库补足，保证五栏始终有产出。 */
function buildColumnTopics(items, music, shuffle){
  // 综合「高热度·高关注·高话题量」= 单一热度信号（代理已做跨平台归一化），按热度降序
  const ranked = (items||[]).slice().sort((a,b)=> (Number(b.heat)||0)-(Number(a.heat)||0));
  if(shuffle && ranked.length>8){ shuffleArr(ranked); }
  const byCol={}; COLLECTIONS.forEach(c=>byCol[c.key]=[]);
  ranked.forEach(it=>{
    const t=String(it&&it.t||''); if(!t) return;
    matchCollections(t).forEach(m=>{
      // 诗笺/映言/留声 改用真实作品数据（见下方生成器），不走热榜转译，避免生硬结合与编造
      if(m.key==='诗笺' || m.key==='映言' || m.key==='留声') return;
      const f=deriveCore(m.hit, m.key);
      byCol[m.key].push({ core:f.core, emo:f.emo, heat:Number(it.heat)||0, kind:(it.src==='常驻'?'常驻':'实时') });
    });
  });
  const result={};
  // 碎语 / 心事：实时热点 + 常驻补足（情感/生活类，常驻主题可接受）
  ['碎语','心事'].forEach(col=>{
    let arr=byCol[col].slice(0,5);
    const need=Math.max(0,4-arr.length);
    (COL_EVERGREEN_BANK[col]||[]).slice(0,need).forEach(core=> arr.push({ core, emo:CORE_FALLBACK[col].emo, heat:0, kind:'常驻' }));
    const seen=new Set(); const cards=[];
    arr.forEach(a=>{ if(seen.has(a.core)) return; seen.add(a.core); cards.push(makeTopicCard(col,a)); });
    result[col]=cards;
  });
  // 诗笺 / 映言 / 留声：真实作品数据（实时优先/库），不编造常驻
  result['诗笺'] = genShiJian(items, shuffle);
  result['映言'] = genYingYan(items, shuffle);
  result['留声'] = genLiuSheng(music, shuffle);
  return result;
}
function makeTopicCard(col, a){
  const tpl=COL_TOPIC_GEN[col];

  return { title, points:tpl.points(a.core,a.emo), kind:a.kind, heat:a.heat };
}

  if(cd.type==='poem'){

      <div class="col-topic-head">

function matchCollections(text){
  const t=text||''; const out=[];
  Object.keys(COL_MATCH).forEach(col=>{
    const m=COL_MATCH[col]; let s=0; let hit=null;
    m.kw.forEach(k=>{ if(t.indexOf(k)!==-1){ s+=1; if(!hit) hit=k; } });
    if(m.strong && m.strong.some(k=>t.indexOf(k)!==-1)){ s+=4; const sk=m.strong.find(k=>t.indexOf(k)!==-1); if(sk) hit=sk; }
    const thr = (col==='碎语')?2:1;   // 碎语为人生/日常大范畴，需 ≥2 分避免什么都算碎语；其余 ≥1 即视为相关
    if(s>=thr) out.push({key:col, score:s, hit:hit});
  });
  out.sort((a,b)=> b.score-a.score);
  return out;
}

function trendBoost(col, items){
  const txt = (items||[]).map(x=>String(x&&x.t||'')).join(' ');
  if(col==='诗笺'){
    return SHI_JIAN_LIB.map(it=>{
      let s=0, rel=false;
      if(txt.indexOf(it.author)>-1){ s+=5; rel=true; }                                  // 具体诗人上热搜
      if(txt.indexOf(it.name.replace(/[《》]/g,''))>-1){ s+=8; rel=true; }                // 具体诗名被提及
      if(/诗词|古诗|唐诗|宋词|汉服|国风|节气|飞花令/.test(txt)) s+=1;                     // 仅影响排序，不打「实时相关」标
      return { it, s, rel };
    });
  }
  if(col==='映言'){
    return YING_YAN_LIB.map(it=>{
      let s=0, rel=false;
      if(txt.indexOf(it.name.replace(/[《》]/g,''))>-1){ s+=8; rel=true; }                // 具体剧名上热搜
      if(/电影|票房|演技|名场面|台词|二刷|新剧|大结局|综艺|番剧|国漫|开播|追剧/.test(txt)) s+=1;
      if(it.type==='电影' && /电影|票房|影片/.test(txt)) s+=1;
      if(it.type==='电视剧' && /剧|追剧|开播|大结局/.test(txt)) s+=1;
      return { it, s, rel };
    });
  }
  return null;
}
function pickReal(lib, scores, shuffle, n){
  let arr = scores.slice();
  arr.sort((a,b)=> b.s - a.s || (Math.random()-0.5));
  if(shuffle){
    const top = arr.filter(x=>x.s>0).slice(0, n);
    const rest = arr.filter(x=>x.s===0); shuffleArr(rest);
    arr = top.concat(rest).slice(0, n);
  }
  return arr.slice(0,n).map(x=>x.it);
}

  const scores = trendBoost('诗笺', items);
  const picks = pickReal(SHI_JIAN_LIB, scores, shuffle, 6);

/* 用实时热词填充某栏句式模板，生成严格对口的栏目选题（live+generated 标记） */
function genColTopics(colKey, liveItems, maxN, rot){
  if(STRUCTURED_COLS.has(colKey)) return buildStructuredTopics(colKey, liveItems, maxN, rot);
  const tpl = COL_TOPIC_TPL[colKey]||[]; const angle = COL_ANGLE[colKey]||'';
  const c = colOf(colKey);
  const trends = (liveItems||[]).map(x=>(x&&(x.t||x.title))||'').filter(Boolean).slice(0,24);
  if(!tpl.length || !trends.length) return [];
  const out=[]; const now=Date.now(); const off=(rot||0); let ti=off;
  for(const kw of trends){
    const tt=String(kw).replace(/^[#\s]+/,'').slice(0,16);
    if(!tt) continue;
    const title = tpl[ti % tpl.length].replace(/\{\{kw\}\}/g, tt);
    out.push({
      id:'gen'+now+'_'+colKey+'_'+out.length, title:title, angle:angle,
      col:colKey, tags:[c.name.replace('晚风','')], source:'实时选题·'+c.name,
      live:true, generated:true, fetchedAt:now, fromKw:tt
    });
    ti++;
    if(out.length>=maxN) break;
  }
  return out;
}
/* —— 三栏结构化选题引擎（晚风诗笺 / 晚风映言 / 晚风留声）——
   联网优先：实时热词命中种子作品 → 标记为「实时」浮到前面；
   本地种子仅参考：未命中的作品按 rot 旋转补足，标记为「参考·离线」。 */
const STRUCTURED_COLS = new Set(['诗笺','映言','留声']);

function makeStructTopic(colKey, c, seed, now, isLive){
  const meta = Object.assign({kind:colKey}, seed);
  let title='';
  if(colKey==='诗笺')      title = '《'+seed.name+'》·'+seed.author+'('+seed.dynasty+')　'+seed.line;
  else if(colKey==='映言') title = '《'+seed.name+'》['+seed.type+']　“'+seed.line+'”　'+seed.role+' / '+seed.actor;
  else if(colKey==='留声') title = '「'+seed.name+'」—'+seed.singer;
  const refTag = (seed.author||seed.singer||seed.type||'');
  return {
    id:'gen'+now+'_'+colKey+'_'+seed.name,
    title:title, meta:meta,
    col:colKey,
    tags:[c.name.replace('晚风',''), refTag].filter(Boolean),
    source: isLive ? ('实时·'+c.name) : ('参考·离线·'+c.name),
    live:!!isLive, generated:true, seedRef:!isLive, fetchedAt:now
  };
}

/* 联网优先：把实时热词匹配到种子作品（命中即标记为实时，最多取 3 条） */
function matchLiveToSeed(colKey, liveItems, seeds){
  const items=(liveItems||[]).map(x=>String((x&&(x.t||x.title))||'')).filter(Boolean);
  const res=[]; const seen=new Set();
  for(const it of items){
    for(const s of seeds){
      if(seen.has(s.name)) continue;
      if(it.indexOf(s.name)>=0 || (s.author&&it.indexOf(s.author)>=0) || (s.singer&&it.indexOf(s.singer)>=0) || (s.actor&&it.indexOf(s.actor)>=0)){
        res.push(s); seen.add(s.name);
        if(res.length>=3) return res;
      }
    }
  }
  return res;
}

function buildStructuredTopics(colKey, liveItems, maxN, rot){
  const seeds = COL_TOPIC_TPL[colKey]||[];
  if(!seeds.length) return [];
  const c = colOf(colKey);
  const now = Date.now();
  const matched = matchLiveToSeed(colKey, liveItems, seeds);              // 联网优先：实时命中
  const liveTopics = matched.map(s=> makeStructTopic(colKey,c,s,now,true));
  const usedNames = new Set(matched.map(s=>s.name));
  const rest = seeds.filter(s=>!usedNames.has(s.name));                   // 本地种子仅参考
  const n = rest.length||1;
  const off = ((((rot||0)%n)+n)%n);
  const rotated = rest.slice(off).concat(rest.slice(0,off));
  const fill = rotated.map(s=> makeStructTopic(colKey,c,s,now,false));
  return liveTopics.concat(fill).slice(0, Math.max(1, maxN||6));
}

/* ============ 三栏结构化选题 · 同源实时参考数据源 ============ */
/* 数据源：仓库内 wfyy/data/{poems,quotes,songs}.json（与页面同源，无跨域问题，稳定可用）。
   每次刷新用 _refreshNonce 轮换取样窗口 + 轻量洗牌，保证「每次点击都看到不同参考」。
   内联 SEED_* 仅作 file:// 直接打开时的兜底（同源 JSON 不可用时）。 */
let _refreshNonce = (Date.now()|0) >>> 0;
function bumpNonce(){ _refreshNonce = (_refreshNonce + 1) >>> 0; return _refreshNonce; }

async function loadJson(name){
  if(typeof fetch!=='function') return null;
  try{
    const r = await withTimeout(fetch('./data/'+name+'.json', {cache:'no-store'}), 6000);
    if(r && r.ok) return await r.json();
  }catch(e){ /* 同源 JSON 不可用（如 file:// 直接打开）：返回 null 走内联兜底 */ }
  return null;
}
/* 从池中取 n 条：按 nonce 轮换取样窗口 + 确定性洗牌，保证刷新间稳定且彼此不同 */
function samplePool(pool, n, nonce){
  if(!Array.isArray(pool) || !pool.length) return [];
  n = n||6;
  const len = pool.length;
  const start = nonce % len;
  const win = [];
  for(let i=0; i<len && win.length<n*2; i++) win.push(pool[(start+i)%len]);
  let arr = win.slice();
  let seed = (nonce>>>0) || 1;
  for(let i=arr.length-1; i>0; i--){ seed = (seed*1103515245+12345)>>>0; const j = seed % (i+1); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr.slice(0, n);
}

async function fetchLiveQuotes(items, selfTags){

  const texts=(items||[]).map(x=>String((x&&(x.t||x.title))||'')).concat(selfTags||[]).filter(Boolean);
  const hits=[]; const seen=new Set();
  for(const txt of texts){
    for(const q of pool){
      if(seen.has(q.name)) continue;
      if(q.themes && q.themes.some(t=> txt.indexOf(t)>=0)){ hits.push(q); seen.add(q.name); }
      else if(txt.indexOf(q.name)>=0 || (q.actor&&txt.indexOf(q.actor)>=0)){ hits.push(q); seen.add(q.name); }

}

/* 抖音/全网实时热词 → 候选标签（经本机/Worker 代理拉取，带真实热度） */
/* 实时热词多为长句描述（如「毕业季租房避坑指南」），需拆成干净短话题标签（≤8字），
   不能整句截断成垃圾。策略：拉丁/数字串直取 → 去虚词整体(≤8) → 连词切分取各段 → 汉字 n-gram 兜底 */
function extractHotTags(phrase){
  const raw=(phrase||'').replace(/\s+/g,' ').trim();
  const s=raw.replace(/[，。、！？!?；;：:"'（）()【】\[\]·…—~～\s\p{P}\p{S}]/gu,''); // 去标点/空格/符号
  if(!s) return [];
  const out=new Set();
  const push=x=>{ x=(x||'').trim(); if(x.length>=2&&x.length<=8) out.add(x); };
  (s.match(/[a-zA-Z0-9]+/g)||[]).forEach(x=>{ if(x.length>=2&&x.length<=8) push(x); }); // 拉丁/数字串（meme/city/00）
  // 话题核心：整句≤8字直接用；否则取「连词之前的片段」(最干净)；再否则截前8字去尾虚词——避免切到词中间
  const seg=((s.split(/(了|的|让|把|给|和|与|跟|引发|导致|造成|如何|怎么|怎样|为什么|为何|是什么|啥是|曝光|后续|盘点|来了|出现|网友|当事人|专家|官方|最新|突发|紧急|通知|提醒|注意|千万别|一定要|建议|原来|这才|终于|居然|竟然|万万没想到|细思极恐|太真实|真实了|人间清醒|冲上|登上|热搜|爆了|炸了|破防|泪目|上头|硬核|深度|揭秘|内幕|实拍|发酵|反转|走红|爆火|火了)/u)[0])||s);
  let core = (s.length<=8) ? s : (seg.length<=8 ? seg : s.slice(0,8).replace(/(了|的|吗|呢|啊|哦|哈|呀|哇|呗|咯|哒|嘞|么|撒|捏)$/u,''));
  if(core.length>=2) push(core);
  if(out.size===0){
    for(const L of [4,3,2]) for(let i=0;i+L<=s.length;i++){ const g=s.slice(i,i+L); if(/[一-龥]{2,}/.test(g)) push(g); if(out.size>=6) break; }
  }
  return [...out].filter(x=>x.length>=2&&x.length<=8).slice(0,6);
}

}

function getTagSuggest(colKey, plats){
  if(!colKey) colKey='碎语';
  const pool=state.tagPool||[];
  const map=new Map(); const out=[];
  const add=x=>{ const k=x.col+'|'+x.tag; const ex=map.get(k);
    if(ex){ ex.live=ex.live||!!x.live; ex.self=ex.self||!!x.self; ex.hitLive=ex.hitLive||!!x.hitLive; ex.ent=ex.ent||!!x.ent; }
    else { const o={tag:x.tag,col:x.col,live:!!x.live,self:!!x.self,hitLive:!!x.hitLive,ent:!!x.ent}; map.set(k,o); out.push(o); } };
  /* 0) 当前文案里的结构化实体（最高优先，用户明确要的：古诗·作者 / 剧名 / 角色演员 / 歌名—歌手） */
  try{
    extractEntities(fieldVal('f_title'), fieldVal('f_text'), colKey).forEach(t=>{ const x={tag:t,col:guessCol(t),live:false,self:false,hitLive:false,ent:true}; const k=x.col+'|'+x.tag; if(!map.has(k)){ map.set(k,x); out.push(x); } });
  }catch(e){}
  pool.filter(x=>x.hitLive && x.col===colKey).forEach(add);            // ① 高契合：命中实时热点（最优先推荐）
  pool.filter(x=>x.live && !x.hitLive && x.col===colKey).forEach(add); // ② 实时热点（未命中我的主题）
  pool.filter(x=>x.self && !x.hitLive && x.col===colKey).forEach(add); // ③ 我的文案主题（未命中热点）
  pool.filter(x=>!x.live && !x.self && x.col===colKey).forEach(x=>{ if(plats.indexOf(x.plat)>=0) add(x); }); // ④ 离线种子（按平台）
  /* ⑤ 抖音/全网实时热词中与「当前主题」真正相关的（跨合集也纳入，标🔥），让建议面板也是实时热标而非只用内置 */
  try{
    const th=themeProfile(fieldVal('f_title'), fieldVal('f_text'));
    const liveRest=pool.filter(x=>x.live && !map.has(x.col+'|'+x.tag));
    liveRest.map(x=>({x,sim:themeSimScore(x.tag,th)})).filter(o=>o.sim>=0.18)
      .sort((a,b)=>b.sim-a.sim).slice(0,8).forEach(o=>{ const x=o.x; if(!map.has(x.col+'|'+x.tag)){ const o2={tag:x.tag,col:x.col,live:true,self:false,hitLive:false}; map.set(x.col+'|'+x.tag,o2); out.push(o2); } });
  }catch(e){}
  return out.slice(0,30);
}

/* 从「标题+文案」构建主题画像：内置词典/词库命中 + 原文实挖 + 全文二元/三元字符特征，
   用于和实时热词算「语义相似度」（不要求逐字出现，相关即可匹配） */
function themeProfile(title, text){
  const blob=(title||'')+' '+(text||'');
  const norm=(blob||'').replace(/[\s\p{P}\p{S}]/gu,'').toLowerCase();
  // 仅取汉字序列做字符特征，避免拉丁/数字互相比对造成伪匹配（如 meme↔emo 共享 em）
  const han=norm.replace(/[^一-龥]/g,'');
  const grams=new Set();
  for(const L of [3,2]) for(let i=0;i+L<=han.length;i++) grams.add(han.slice(i,i+L));
  const hits=new Set();
  SELF_TAG_DICT.forEach(k=>{ if(blob.indexOf(k)!==-1) hits.add(k.toLowerCase()); });
  CONTENT_VOCAB.forEach(k=>{ if(blob.indexOf(k)!==-1) hits.add(k.toLowerCase()); });
  extractBodyTags(text).forEach(t=>hits.add(t.toLowerCase()));
  if(title){ const tl=title.replace(/[\s\p{P}\p{S}]/gu,'').toLowerCase().slice(0,14); if(tl) hits.add(tl); }
  return {norm, han, grams, hits};
}
function themeSimScore(tag, th){
  const t=String(tag||'').replace(/[\s\p{P}\p{S}]/gu,'').toLowerCase();
  if(!t.length) return 0;
  if(th.hits.has(t)) return 1;
  for(const h of th.hits){ if(h && (t.indexOf(h)!==-1 || h.indexOf(t)!==-1)) return 1; }
  const hasHan=/[一-龥]/.test(t);
  if(!hasHan) return (th.norm.indexOf(t)!==-1) ? 1 : 0;   // 纯拉丁/数字标签：仅原文逐字命中才算相关
  const hanT=t.replace(/[^一-龥]/g,'');
  const tg=[]; for(const L of [3,2]) for(let i=0;i+L<=hanT.length;i++) tg.push(hanT.slice(i,i+L));
  if(!tg.length) return 0;
  let hit=0; tg.forEach(g=>{ if(th.grams.has(g)) hit++; });
  return hit/tg.length;
}
function themePickTags(colKey, plats, title, text, n, extraLive){
  const th=themeProfile(title,text);
  const titleNorm=(title||'').replace(/[<>&"'，。、！？!?；;：:"'（）()【】\[\]·\s\n\r]/g,'').trim().slice(0,14).toLowerCase();
  const candMap=new Map();
  const add=(tag,live,self,hitLive,heat,src)=>{
    tag=(tag||'').trim().slice(0,14); if(!tag||tag.length<1) return;   // 允许单字（猫/海/雨等词库单字标签）
    const kl=tag.toLowerCase();
    if(kl===titleNorm) return;                                       // 跳过「整条标题」这种过长伪标签
    const ex=candMap.get(kl);
    if(ex){ ex.live=ex.live||live; ex.self=ex.self||self; ex.hitLive=ex.hitLive||hitLive; if(heat) ex.heat=Math.max(ex.heat||0,heat); return; }
    candMap.set(kl,{tag,col:guessCol(tag),live,self,hitLive,heat:heat||0,src:src||''});
  };
  extractEntities(title,text,colKey).forEach(t=>add(t,false,false,false,0,'entity'));        // ① 结构化实体（古诗词·作者/剧名/角色演员/歌名—歌手）最高优先
  extractSelfTags(title,text,colKey).forEach(t=>add(t,false,true,false,0,'self'));            // ② 情感主题词典（氛围向，天然相关）
  extractBodyTags(text).forEach(t=>add(t,false,false,false,0,'body'));                       // ③ 文案原文实挖（内容向，最贴合）
  (state.tagPool||[]).filter(x=>x.live).forEach(x=>add(x.tag,true,false,!!x.hitLive,x.heat||1,'pool'));   // ④ 实时热门（含抖音真实热度）
  (state.tagPool||[]).filter(x=>x.self).forEach(x=>add(x.tag,false,true,!!x.hitLive,x.heat||0,'self'));    // ⑤ 我的文案主题池
  (state.tagPool||[]).filter(x=>!x.live&&!x.self).forEach(x=>{ if(plats.indexOf(x.plat)>=0) add(x.tag,false,false,false,0,'seed'); }); // ⑥ 离线种子
  if(extraLive && extraLive.length) extraLive.forEach(o=>add(o.tag,true,false,false,o.heat||1,'live'));     // ⑦ 本次抖音实时直拉候选
  const maxHeat=Math.max(1,...[...candMap.values()].map(o=>o.heat||0));
  const cands=[...candMap.values()].map(o=>{
    const sim=themeSimScore(o.tag, th);                              // 与当前主题语义相似度 0~1
    const builtin=(o.src==='self'||o.src==='body'||o.src==='entity');// 内置/词典/原文/实体，天然相关
    const colBoost=(o.col===colKey)?1.5:0;                          // 合集契合（加成，但不足以单独入选）
    const heatNorm=(o.heat?Math.min(o.heat,maxHeat)/maxHeat:0);     // 抖音真实热度归一
    const entBoost=(o.src==='entity')?8:0;                          // 结构化实体强力置顶（用户明确要的）
    const eligible = builtin || o.hitLive || sim>=0.12;             // 入选：内置命中 / 命中实时 / 与主题语义相关
    const s = (builtin?5:0) + sim*5 + colBoost + heatNorm*3 + entBoost + (o.live?0.5:0) + (o.hitLive?1.2:0);
    return {tag:o.tag, s, heat:o.heat||0, eligible};
  });
  return cands.filter(x=>x.eligible && x.s>0)                        // 仅取真正相关的标签，不塞无关热词
    .sort((a,b)=> (b.s-a.s) || (b.heat-a.heat))                     // 先按契合度，再按抖音实时热度排
    .slice(0,n).map(x=>x.tag);
}
function refreshTagPool(){
  const btn=document.querySelector('#tagSuggest .btn-soft');
  const curCol=document.getElementById('f_col'); const colKey=curCol?curCol.value:'碎语';
  const curPlats=[...document.querySelectorAll('#f_plats input:checked')].map(i=>i.value);
  const title=fieldVal('f_title'), text=fieldVal('f_text');
  const runPick=(liveCands)=>{
    const picks=themePickTags(colKey, curPlats, title, text, 6, (liveCands&&liveCands.length)?liveCands:null);
    const el=document.getElementById('f_tags');
    if(picks.length && el){
      const have=(el.value||'').split(',').map(s=>s.trim()).filter(Boolean);
      picks.forEach(t=>{ if(have.indexOf(t)===-1) have.push(t); });   // 合并而非覆盖，保留手写标签
      el.value=have.slice(0,8).join(', ');
      if(typeof liveDupCheck==='function') liveDupCheck();
      flashToast('已按主题匹配 '+picks.length+' 个标签（抖音实时热榜+文案原文）：'+picks.join('、'));
    } else if(el){
      // 兜底：未匹配到强相关时，附当前抖音热榜前 3 供手动挑选，避免「暂无可用标签」
      const top=(liveCands||[]).slice().sort((a,b)=>(b.heat||0)-(a.heat||0)).slice(0,3).map(x=>x.tag).filter(Boolean);
      if(top.length){
        const have=(el.value||'').split(',').map(s=>s.trim()).filter(Boolean);
        top.forEach(t=>{ if(have.indexOf(t)===-1) have.push(t); });
        el.value=have.slice(0,8).join(', ');
        if(typeof liveDupCheck==='function') liveDupCheck();
        flashToast('未匹配到强相关标签，已附当前抖音热榜前 3：'+top.join('、'));
      } else {
        flashToast('当前主题暂无可匹配标签，已保留原标签');
      }
    }
    if(document.getElementById('tagSuggest')) refreshTagSuggest();
  };
  if(btn){ btn.disabled=true; btn.textContent='刷新中…'; }
  // 优先拉抖音/全网实时热词（经本机/Worker 代理）；失败则退回离线热点库按主题匹配
  fetchLiveTagCandidates().then(cands=>{
    if(cands && cands.length){ syncTagPoolFromHotLive(cands, Date.now()); recomputeSelfHit(); save(); }
    if(btn){ btn.disabled=false; btn.textContent='↻ 刷新标签'; }
    runPick(cands);
  }).catch(e=>{
    if(btn){ btn.disabled=false; btn.textContent='↻ 刷新标签'; }
    flashToast('抖音实时代理暂连不上，已用离线热点库按主题匹配');
    fetchLiveItems().then(items=>{ if(items&&items.length){ syncTagPoolFromHot(items, Date.now()); recomputeSelfHit(); save(); } runPick(null); })
      .catch(()=>runPick(null));
  });
}


/* ============ 发布节奏 · 合集交替 ============ */
function lastWorkByCol(){
  const map={};
  state.works.forEach(w=>{ if(!map[w.collection] || (w.date||'')>(map[w.collection].date||'')) map[w.collection]=w; });
  return map;
}
function computeRhythm(){
  const byCol=lastWorkByCol();
  const all=Object.values(byCol);
  if(!all.length) return {last:null,next:null};
  const last=all.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  const keys=COLLECTIONS.map(c=>c.key);
  const dated=keys.map(k=>({key:k,date:byCol[k]?byCol[k].date:'0000-00-00'}));
  const others=dated.filter(d=>d.key!==last.collection).sort((a,b)=>a.date.localeCompare(b.date));
  return {last:last.collection, next:others[0].key};
}
function renderRhythm(){
  const box=document.getElementById('rhythmCard');
  if(!box) return;
  const {last,next}=computeRhythm();
  const recent=state.works.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8);
  let dots=recent.map(w=>{ const c=colOf(w.collection); return `<span title="${esc(w.title)} · ${c.name} · ${w.date}" style="width:15px;height:15px;border-radius:50%;background:${c.color};display:inline-block;margin-right:5px"></span>`; }).join('');
  let warn='';
  if(recent.length>=2 && recent[0].collection===recent[1].collection && next){
    warn=`<div class="banner" style="margin-top:10px">⚠ 最近两次都是「${colOf(recent[0].collection).name}」，建议本轮换「${colOf(next).name}」交替，避免读者审美疲劳。</div>`;
  }
  const lastHtml=last? `上轮：<b style="color:${colOf(last).color}">${colOf(last).name}</b>` : '上轮：—';
  const nextHtml=next? `建议本轮：<b style="color:${colOf(next).color}">${colOf(next).name}</b> <button class="mini" style="margin-left:8px" onclick="setActiveCol('${next}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>就发这个</button>` : '';
  box.innerHTML=`<div class="rhythm-card">
    <div class="rhythm-head">📅 发布节奏 · 合集交替</div>
    <div class="rhythm-row">${lastHtml} &nbsp;·&nbsp; ${nextHtml}</div>
    <div class="rhythm-dots">${dots||'<span style="font-size:12px;color:var(--ink2)">还没有发布记录</span>'}</div>
    ${warn}
  </div>`;
}
function toggleCol(key){
  if(state.activeCol===key){ clearActiveCol(); }
  else { setActiveCol(key); }
}
function setActiveCol(key){
  state.activeCol=key; save(); renderIdeas(); renderRhythm(); renderHotTopics();
  flashToast('本轮聚焦：'+colOf(key).name);

function clearActiveCol(){

function flashToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.className='toast'; t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');

function findSimilarMaterial(inputContent, excludeId){
  const c=(inputContent||'').trim().toLowerCase();
  if(!c||c.length<2) return [];
  return state.materials.filter(m=>{
    if(m.id===excludeId) return false;
    const mt=(m.content||'').toLowerCase();
    return (mt.includes(c)||c.includes(mt));
  });
}

function pct(a,b){ return b>0 ? (a/b*100) : 0; }
